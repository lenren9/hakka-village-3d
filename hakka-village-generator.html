<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>客家围龙屋古村地图生成器</title>
  <style>
    :root {
      --panel: rgba(13, 20, 17, 0.86);
      --panel-line: rgba(208, 220, 204, 0.18);
      --text: #eef4eb;
      --muted: #aebcaf;
      --accent: #d6ad52;
      --accent-2: #7fb79a;
      --danger: #e08d7d;
      --shadow: rgba(0, 0, 0, 0.38);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 65% 18%, rgba(104, 139, 110, 0.18), transparent 36%),
        linear-gradient(160deg, #18241e 0%, #0c1512 48%, #111914 100%);
      color: var(--text);
    }

    body {
      position: relative;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 18px;
      left: 18px;
      width: min(378px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px var(--shadow);
      backdrop-filter: blur(16px) saturate(1.1);
      pointer-events: auto;
      scrollbar-width: thin;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 28px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 7px 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .primary-button {
      width: 100%;
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 7px;
      background: linear-gradient(135deg, #d9b35d, #b88d37);
      color: #182016;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
    }

    .primary-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    .primary-button:disabled {
      cursor: wait;
      opacity: 0.62;
      transform: none;
    }

    .view-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding: 4px;
      margin: 10px 0 2px;
      border: 1px solid var(--panel-line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.035);
    }

    .view-button {
      min-height: 34px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .view-button:hover {
      color: var(--text);
    }

    .view-button.active {
      background: rgba(127, 183, 154, 0.22);
      color: #eaf6ea;
      box-shadow: inset 0 0 0 1px rgba(127, 183, 154, 0.26);
    }

    .tool-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 11px 0 14px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid var(--panel-line);
      border-radius: 7px;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
      cursor: pointer;
    }

    .toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent-2);
    }

    .seed {
      min-width: 90px;
      padding: 0 10px;
      color: var(--muted);
      font: 11px/1.2 Consolas, "SFMono-Regular", monospace;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .rule-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(127, 183, 154, 0.28);
      border-radius: 7px;
      background: rgba(127, 183, 154, 0.08);
    }

    .rule-summary strong {
      color: var(--accent-2);
      font-size: 14px;
    }

    .rule-summary span {
      color: var(--muted);
      font-size: 11px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(220, 230, 217, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .stat-value {
      display: block;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding-top: 12px;
      border-top: 1px solid var(--panel-line);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 10px;
    }

    .check-dot {
      flex: 0 0 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(127, 183, 154, 0.1);
    }

    .check.fail {
      color: var(--danger);
    }

    .check.fail .check-dot {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(224, 141, 125, 0.1);
    }

    .model-status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .fallback-notice {
      margin: 9px 0 0;
      padding: 9px 10px;
      border: 1px solid rgba(214, 173, 82, 0.28);
      border-radius: 6px;
      background: rgba(214, 173, 82, 0.08);
      color: #e8d9a9;
      font-size: 10px;
      line-height: 1.5;
    }

    .legend {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
      max-width: calc(100vw - 36px);
      padding: 9px 11px;
      border: 1px solid var(--panel-line);
      border-radius: 7px;
      background: rgba(11, 18, 15, 0.72);
      color: var(--muted);
      font-size: 10px;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #9b8d70;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      background: rgba(8, 13, 11, 0.66);
      opacity: 1;
      visibility: visible;
      transition: opacity 280ms ease, visibility 280ms ease;
      pointer-events: auto;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(310px, calc(100vw - 44px));
      padding: 20px;
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      background: #111a16;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.48);
      text-align: center;
    }

    .loading-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
    }

    .loading-text {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 850ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 720px) {
      .panel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-height: 50vh;
        padding: 13px;
      }

      .subtitle {
        display: none;
      }

      .legend {
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="可旋转缩放的客家围龙屋古村三维地图"></canvas>

  <div class="hud">
    <section class="panel" aria-label="古村生成控制台">
      <p class="eyebrow">Hakka Mountain Village</p>
      <h1>客家围龙屋古村图谱</h1>
      <p class="subtitle">程序化地形、河路、田宅与风水建筑生成器</p>

      <button id="generate" class="primary-button" type="button">生成新的古村</button>

      <div class="view-switch" role="group" aria-label="镜头视角">
        <button id="view-orbit" class="view-button active" type="button" aria-pressed="true">自由视角</button>
        <button id="view-overview" class="view-button" type="button" aria-pressed="false">俯瞰视角</button>
      </div>

      <div class="tool-row">
        <label class="toggle" for="use-glb">
          <input id="use-glb" type="checkbox" checked />
          <span>优先加载 GLB</span>
        </label>
        <div id="seed" class="seed" aria-live="polite">seed: --</div>
      </div>

      <div class="rule-summary">
        <strong id="rule-summary">规则校验 --</strong>
        <span id="model-status">外部模型尚未检测</span>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">围龙屋规模</span>
          <span id="stat-rings" class="stat-value">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">墙体材质</span>
          <span id="stat-material" class="stat-value">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">风水塘</span>
          <span id="stat-pond" class="stat-value">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">装饰密度</span>
          <span id="stat-decoration" class="stat-value">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">民居与农田</span>
          <span id="stat-buildings" class="stat-value">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">宝塔规格</span>
          <span id="stat-pagoda" class="stat-value">--</span>
        </div>
      </div>

      <div id="checks" class="checks" aria-live="polite"></div>
      <p id="protocol-note" class="model-status"></p>
      <p id="fallback-notice" class="fallback-notice">当前为纯代码预览模式，加载本地 GLB 可获极致画质</p>
    </section>
  </div>

  <div class="legend" aria-label="地图图例">
    <span class="legend-item"><i class="swatch" style="background:#80745f"></i>夯土</span>
    <span class="legend-item"><i class="swatch" style="background:#68726f"></i>青砖</span>
    <span class="legend-item"><i class="swatch" style="background:#58636a"></i>屋瓦</span>
    <span class="legend-item"><i class="swatch" style="background:#4f8ca0"></i>水系</span>
    <span class="legend-item"><i class="swatch" style="background:#7d954a"></i>农田</span>
    <span class="legend-item"><i class="swatch" style="background:#355c38"></i>风水林</span>
  </div>

  <div id="loading" class="loading">
    <div class="loading-card">
      <div class="spinner"></div>
      <p class="loading-title">正在营造古村</p>
      <p class="loading-text">生成地形、河道、道路、宅院和风水林</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    /*
      单文件运行与 3ds Max 2022 工作流
      =================================

      A. 推荐运行方式
      1. 保持本 HTML 与 models 文件夹位于同一目录。
      2. 在 VS Code 中安装 Live Server 插件。
      3. 右键本 HTML，选择 Open with Live Server。
      4. 将 3ds Max 导出的 GLB 放到：
         ./models/hakka-village.glb
         ./models/weiwu_1.glb
         ./models/weiwu_2.glb
         ./models/weiwu_3.glb
         ./models/gangwu.glb
         ./models/diantang.glb
         ./models/fengshuita.glb
         ./models/paifang.glb
         ./models/tree.glb
      文件名不存在时会自动使用本文内置的高精度几何体模型。

      B. 直接双击 file:// 的浏览器限制
      Chrome、Edge 通常禁止 file:// 页面 fetch 本地 GLB。页面本身仍可运行，
      但 GLB 会加载失败并自动回退到程序化模型。若必须绝对单文件，可把极小的
      GLB 转成 Base64，并替换对应路径为 data URI：

      PowerShell 示例：
      $b=[Convert]::ToBase64String([IO.File]::ReadAllBytes(".\models\weiwu_1.glb"))
      "data:model/gltf-binary;base64,$b" | Set-Clipboard

      然后在 ASSET_MANIFEST 中将路径改为剪贴板中的 data URI。Base64 会让文件
      体积增加约三分之一，高精度模型不建议嵌入。

      C. 3ds Max 2022 导出建议
      0. 3ds Max 2022 本身不一定预装 glTF Exporter。若 File > Export 中没有
         glTF Binary (*.glb)，请先在 Autodesk App Store 安装官方
         "glTF Exporter for 3ds Max 2022" 扩展，安装后重启 3ds Max。
      1. 在 3ds Max 中使用真实世界单位，建议 1 单位 = 1 米。
      2. 导出前把模型底面中心放到世界原点，模型正面朝 +Z，向上为 +Y。
      3. 用 File > Export > Export Selected 或导出场景为 glTF Binary (.glb)。
      4. 勾选材质、贴图、法线和切线；游戏用模型可用 2K 或 4K 贴图。
      5. 若 3ds Max 导出器把正面朝向改成 -Z，可在 ASSET_MANIFEST 的
         forwardOffset 中填 Math.PI 修正。
      6. GLB 的建筑、塔和树可以共用材质；生成器会按目标尺寸自动缩放，
         但建议围龙屋保持在约 20 至 42 米，塔约 7 至 12 米。
    */

    const WORLD = {
      cols: 64,
      rows: 48,
      cell: 2.4,
      maxPlacementAttempts: 5000
    };
    WORLD.width = WORLD.cols * WORLD.cell;
    WORLD.depth = WORLD.rows * WORLD.cell;
    WORLD.halfW = WORLD.width * 0.5;
    WORLD.halfD = WORLD.depth * 0.5;

    const ASSET_MANIFEST = {
      // 首选的 3ds Max 整体围龙屋模型。存在时会优先替换程序化核心建筑；
      // 缺失、损坏或 file:// 下无法读取时，会自动回退到内置几何体。
      village: { path: "./models/hakka-village.glb", forwardOffset: 0 },
      weiwu_1: { path: "./models/weiwu_1.glb", forwardOffset: 0 },
      weiwu_2: { path: "./models/weiwu_2.glb", forwardOffset: 0 },
      weiwu_3: { path: "./models/weiwu_3.glb", forwardOffset: 0 },
      weiwu: { path: "./models/weiwu.glb", forwardOffset: 0 },
      gangwu: { path: "./models/gangwu.glb", forwardOffset: 0 },
      diantang: { path: "./models/diantang.glb", forwardOffset: 0 },
      fengshuita: { path: "./models/fengshuita.glb", forwardOffset: 0 },
      paifang: { path: "./models/paifang.glb", forwardOffset: 0 },
      tree: { path: "./models/tree.glb", forwardOffset: 0 }
    };

    const ui = {
      canvas: document.getElementById("scene"),
      generate: document.getElementById("generate"),
      useGLB: document.getElementById("use-glb"),
      seed: document.getElementById("seed"),
      ruleSummary: document.getElementById("rule-summary"),
      modelStatus: document.getElementById("model-status"),
      checks: document.getElementById("checks"),
      protocolNote: document.getElementById("protocol-note"),
      loading: document.getElementById("loading"),
      statRings: document.getElementById("stat-rings"),
      statMaterial: document.getElementById("stat-material"),
      statPond: document.getElementById("stat-pond"),
      statDecoration: document.getElementById("stat-decoration"),
      statBuildings: document.getElementById("stat-buildings"),
      statPagoda: document.getElementById("stat-pagoda"),
      viewOrbit: document.getElementById("view-orbit"),
      viewOverview: document.getElementById("view-overview"),
      fallbackNotice: document.getElementById("fallback-notice")
    };

    // =========================================================
    // 01 初始化模块：渲染器、场景、相机、控制器、后处理
    // =========================================================

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x9eaa91, 0.0048);

    const renderer = new THREE.WebGLRenderer({
      canvas: ui.canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0xb7c4ae, 1);

    const camera = new THREE.PerspectiveCamera(
      43,
      window.innerWidth / window.innerHeight,
      0.1,
      420
    );
    camera.position.set(82, 86, 112);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.target.set(-5, 0, -2);
    controls.minDistance = 34;
    controls.maxDistance = 235;
    controls.maxPolarAngle = Math.PI * 0.475;
    controls.minPolarAngle = Math.PI * 0.12;
    controls.screenSpacePanning = false;

    // 后处理只做增强，不是启动前置条件。这里禁止使用顶层 await，
    // 否则 CDN 缓慢时会阻塞灯光、生成器和 UI 事件注册。
    let composer = null;
    let postProcessingReady = false;
    let postProcessingRequested = false;

    const hemiLight = new THREE.HemisphereLight(0xd9e7d6, 0x35402f, 2.05);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xffe1ad, 2.65);
    sun.position.set(-72, 96, 62);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -95;
    sun.shadow.camera.right = 95;
    sun.shadow.camera.top = 92;
    sun.shadow.camera.bottom = -92;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 260;
    sun.shadow.bias = -0.00018;
    sun.shadow.normalBias = 0.035;
    scene.add(sun);
    scene.add(sun.target);
    sun.target.position.set(-4, 0, 0);

    const ambient = new THREE.AmbientLight(0xb8c6b5, 0.32);
    scene.add(ambient);

    const worldRoot = new THREE.Group();
    scene.add(worldRoot);

    const state = {
      seed: 0,
      rng: null,
      models: new Map(),
      modelsLoaded: false,
      modelErrors: [],
      loadingModels: false,
      mapData: null,
      waterTextures: [],
      waterMaterials: [],
      generatedTextures: [],
      skyMaterial: null,
      isGenerating: false,
      externalLoadPromise: null,
      cameraMode: "orbit",
      cameraTween: null,
      keys: new Set(),
      lastFrame: performance.now(),
      renderStats: {
        triangles: 0
      }
    };

    const geometryCache = new Map();
    const gltfLoader = new GLTFLoader();

    function cachedGeometry(key, factory) {
      if (!geometryCache.has(key)) {
        const geometry = factory();
        geometry.userData.shared = true;
        geometryCache.set(key, geometry);
      }
      return geometryCache.get(key);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function randRange(rng, min, max) {
      return min + (max - min) * rng();
    }

    function randInt(rng, min, max) {
      return Math.floor(randRange(rng, min, max + 1));
    }

    function choice(rng, values) {
      return values[Math.floor(rng() * values.length)];
    }

    function mulberry32(seed) {
      let value = seed >>> 0;
      return function random() {
        value += 0x6d2b79f5;
        let t = value;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function makeSeed() {
      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] >>> 0;
      }
      return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
    }

    function nextFrame() {
      return new Promise((resolve) => {
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(resolve);
        } else {
          setTimeout(resolve, 16);
        }
      });
    }

    // 把重任务拆成多个浏览器任务片段，让加载动画与窗口事件始终有机会执行。
    function yieldToBrowser() {
      return new Promise((resolve) => {
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(() => setTimeout(resolve, 0));
        } else {
          setTimeout(resolve, 0);
        }
      });
    }

    function scheduleConstruction(task, delay = 0) {
      if (typeof requestIdleCallback === "function") {
        requestIdleCallback(() => task(), { timeout: 900 });
        return;
      }
      setTimeout(task, Math.max(0, delay));
    }

    function withTimeout(promise, timeout, message) {
      let timer = 0;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error(message)), timeout);
        })
      ]).finally(() => clearTimeout(timer));
    }

    function distance2D(a, b) {
      return Math.hypot(a.x - b.x, a.z - b.z);
    }

    function axisAligned(segment) {
      return Math.abs(segment.x2 - segment.x1) < 0.001 ||
        Math.abs(segment.z2 - segment.z1) < 0.001;
    }

    function paintCanvas(size, draw) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d", { alpha: false });
      draw(context, size);
      return canvas;
    }

    function makeCanvasTexture(size, repeatX, repeatY, draw, colorSpace = THREE.SRGBColorSpace) {
      const canvas = paintCanvas(size, draw);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.colorSpace = colorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.needsUpdate = true;
      state.generatedTextures.push(texture);
      return texture;
    }

    function makeEarthTexture(rng, baseColor = "#8d8069", accentColor = "#6f6452") {
      return makeCanvasTexture(256, 5, 5, (ctx, size) => {
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, size, size);

        for (let i = 0; i < 3400; i += 1) {
          const x = rng() * size;
          const y = rng() * size;
          const radius = 0.25 + rng() * 1.65;
          ctx.globalAlpha = 0.05 + rng() * 0.14;
          ctx.fillStyle = rng() > 0.48 ? accentColor : "#d0c2a2";
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = "#524a3c";
        ctx.lineWidth = 1.4;
        for (let y = 18; y < size; y += 28) {
          ctx.beginPath();
          ctx.moveTo(0, y + (rng() - 0.5) * 3);
          ctx.bezierCurveTo(
            size * 0.3,
            y + (rng() - 0.5) * 5,
            size * 0.65,
            y + (rng() - 0.5) * 5,
            size,
            y + (rng() - 0.5) * 3
          );
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
      });
    }

    function makeBrickTexture(rng, baseColor = "#727a76", mortarColor = "#4f5652") {
      return makeCanvasTexture(256, 4, 4, (ctx, size) => {
        ctx.fillStyle = mortarColor;
        ctx.fillRect(0, 0, size, size);
        const rowHeight = 22;
        const brickWidth = 47;

        for (let row = -1; row < Math.ceil(size / rowHeight) + 1; row += 1) {
          const offset = row % 2 === 0 ? -brickWidth * 0.5 : 0;
          for (let x = offset; x < size + brickWidth; x += brickWidth) {
            const jitter = (rng() - 0.5) * 4;
            const shade = 0.84 + rng() * 0.26;
            ctx.fillStyle = shadeHex(baseColor, shade);
            ctx.fillRect(x + 2, row * rowHeight + 2 + jitter, brickWidth - 4, rowHeight - 4);
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = "#d9ddd8";
            ctx.fillRect(x + 4, row * rowHeight + 4 + jitter, brickWidth - 8, 1);
            ctx.globalAlpha = 1;
          }
        }

        for (let i = 0; i < 520; i += 1) {
          ctx.globalAlpha = 0.035 + rng() * 0.07;
          ctx.fillStyle = rng() > 0.5 ? "#101713" : "#d4d9d3";
          ctx.fillRect(rng() * size, rng() * size, 1 + rng() * 3, 1 + rng() * 3);
        }
        ctx.globalAlpha = 1;
      });
    }

    function makeRoofTexture(rng) {
      return makeCanvasTexture(256, 7, 7, (ctx, size) => {
        ctx.fillStyle = "#58636a";
        ctx.fillRect(0, 0, size, size);

        const rowHeight = 18;
        const tileWidth = 12;
        for (let row = 0; row < size / rowHeight + 1; row += 1) {
          const offset = row % 2 === 0 ? -tileWidth * 0.5 : 0;
          for (let x = offset; x < size + tileWidth; x += tileWidth) {
            ctx.fillStyle = shadeHex("#58636a", 0.82 + rng() * 0.3);
            ctx.beginPath();
            ctx.moveTo(x, row * rowHeight + rowHeight);
            ctx.quadraticCurveTo(
              x + tileWidth * 0.5,
              row * rowHeight - 1 + rng() * 2,
              x + tileWidth,
              row * rowHeight + rowHeight
            );
            ctx.lineTo(x + tileWidth, row * rowHeight + rowHeight - 4);
            ctx.quadraticCurveTo(
              x + tileWidth * 0.5,
              row * rowHeight + 2,
              x,
              row * rowHeight + rowHeight - 4
            );
            ctx.closePath();
            ctx.fill();
          }
        }

        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = "#b7c0c0";
        ctx.lineWidth = 1;
        for (let y = rowHeight; y < size; y += rowHeight) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(size, y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      });
    }

    function makeCobbleTexture(rng) {
      return makeCanvasTexture(256, 6, 6, (ctx, size) => {
        ctx.fillStyle = "#716f65";
        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 360; i += 1) {
          const radiusX = 3 + rng() * 7;
          const radiusY = 2 + rng() * 6;
          const x = rng() * size;
          const y = rng() * size;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rng() * Math.PI);
          ctx.fillStyle = shadeHex("#9b9789", 0.78 + rng() * 0.38);
          ctx.beginPath();
          ctx.ellipse(0, 0, radiusX, radiusY, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 0.24;
          ctx.fillStyle = "#252820";
          ctx.beginPath();
          ctx.ellipse(1, 1, radiusX, radiusY, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.restore();
        }
      });
    }

    function makeStoneTexture(rng) {
      return makeCanvasTexture(256, 5, 5, (ctx, size) => {
        ctx.fillStyle = "#9c9b91";
        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 2200; i += 1) {
          ctx.globalAlpha = 0.025 + rng() * 0.09;
          ctx.fillStyle = rng() > 0.5 ? "#f0efe7" : "#4b514d";
          ctx.fillRect(rng() * size, rng() * size, 1 + rng() * 4, 1 + rng() * 4);
        }
        ctx.globalAlpha = 0.16;
        ctx.strokeStyle = "#575d58";
        ctx.lineWidth = 1;
        for (let y = 5; y < size; y += 12) {
          ctx.beginPath();
          ctx.moveTo(0, y + rng() * 2);
          ctx.lineTo(size, y - rng() * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      });
    }

    function makeRoadTexture(rng) {
      return makeCanvasTexture(256, 12, 3, (ctx, size) => {
        ctx.fillStyle = "#807a6b";
        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 5200; i += 1) {
          ctx.globalAlpha = 0.035 + rng() * 0.16;
          ctx.fillStyle = rng() > 0.45 ? "#c7bda2" : "#3e4138";
          const r = 0.3 + rng() * 2.1;
          ctx.beginPath();
          ctx.arc(rng() * size, rng() * size, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      });
    }

    function makeWaterTexture(rng) {
      return makeCanvasTexture(256, 8, 2, (ctx, size) => {
        ctx.fillStyle = "#437b8b";
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = "rgba(218, 240, 238, 0.35)";
        ctx.lineWidth = 1.3;
        for (let i = 0; i < 48; i += 1) {
          const y = rng() * size;
          const x = rng() * size;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.bezierCurveTo(
            x + 12,
            y - 3,
            x + 22,
            y + 3,
            x + 38,
            y
          );
          ctx.stroke();
        }
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "#dcefeb";
        for (let i = 0; i < 260; i += 1) {
          ctx.fillRect(rng() * size, rng() * size, 1 + rng() * 2, 1);
        }
        ctx.globalAlpha = 1;
      });
    }

    function shadeHex(hex, factor) {
      const color = new THREE.Color(hex);
      color.multiplyScalar(factor);
      return `#${color.getHexString()}`;
    }

    function applyWaterWave(material, amplitude = 0.055) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uWaveTime = { value: 0 };
        shader.uniforms.uWaveAmplitude = { value: amplitude };
        shader.vertexShader = `
          uniform float uWaveTime;
          uniform float uWaveAmplitude;
        ` + shader.vertexShader.replace(
          "#include <begin_vertex>",
          `
            vec3 transformed = vec3(position);
            transformed.y += uWaveAmplitude * (
              sin(position.x * 0.42 + uWaveTime * 1.35) +
              cos(position.z * 0.58 + uWaveTime * 1.12)
            );
          `
        );
        material.userData.shader = shader;
      };
      material.needsUpdate = true;
      return material;
    }

    function createRoadPlan(rng, config) {
      const riverZ = randRange(rng, 16, 23);

      const mainRoadWidth = randRange(rng, 5.5, 7);
      const northRoadZ = randRange(rng, -33, -25);
      const riversideRoadZ = riverZ - riverWidth * 0.5 - randRange(rng, 6.5, 10.5);
      const eastRoadX = mainRoadX + randRange(rng, 20, 29);
      const southRoadZ = randRange(rng, 34, 41);
      const westStart = config.tulouX + config.radius + randRange(rng, 8, 13);

      const river = {
        x1: -WORLD.halfW,
        x2: WORLD.halfW,
        z: riverZ,
        z1: riverZ,
        z2: riverZ,
        width: riverWidth,
        axis: "x",
        kind: "river"
      };

      const bridgeCenter = {
        x: mainRoadX,
        z: riverZ
      };
      const bridgeClearance = riverWidth * 0.5 + 2.25;

      const roads = [
        {
          x1: mainRoadX,
          z1: -WORLD.halfD + 4.5,
          x2: mainRoadX,
          z2: riverZ - bridgeClearance,
          width: mainRoadWidth,
          axis: "z",
          kind: "main"
        },
        {
          x1: mainRoadX,
          z1: riverZ + bridgeClearance,
          x2: mainRoadX,
          z2: WORLD.halfD - 4.5,
          width: mainRoadWidth,
          axis: "z",
          kind: "main"
        },
        {
          x1: westStart,
          z1: northRoadZ,
          x2: WORLD.halfW - 5,
          z2: northRoadZ,
          width: randRange(rng, 4.1, 5.2),
          axis: "x",
          kind: "cross"
        },
        {
          x1: westStart,
          z1: riversideRoadZ,
          x2: WORLD.halfW - 5,
          z2: riversideRoadZ,
          width: randRange(rng, 4.4, 5.7),
          axis: "x",
          kind: "waterfront"
        },
        {
          x1: eastRoadX,
          z1: northRoadZ,
          x2: eastRoadX,
          z2: southRoadZ,
          width: randRange(rng, 3.8, 4.9),
          axis: "z",
          kind: "cross"
        },
        {
          x1: mainRoadX,
          z1: southRoadZ,
          x2: WORLD.halfW - 5,
          z2: southRoadZ,
          width: randRange(rng, 4, 5),
          axis: "x",
          kind: "cross"
        }
      ];

      const bridgeRoad = {
        x1: mainRoadX,
        z1: riverZ - bridgeClearance,
        x2: mainRoadX,
        z2: riverZ + bridgeClearance,
        width: mainRoadWidth,
        axis: "z",
        kind: "bridge"
      };

      return {
        river,
        riverZ,
        riverWidth,
        mainRoadX,
        mainRoadWidth,
        northRoadZ,
        riversideRoadZ,
        eastRoadX,
        southRoadZ,
        roads,
        bridgeRoad,
        bridgeCenter,
        allRoadSegments: [...roads, bridgeRoad],
        crossings: [{ river, road: bridgeRoad }]
      };
    }

    function nearestPointOnSegment(x, z, segment) {
      const dx = segment.x2 - segment.x1;
      const dz = segment.z2 - segment.z1;
      const lengthSq = dx * dx + dz * dz;
      if (lengthSq < 0.0001) {
        return { x: segment.x1, z: segment.z1, distance: Math.hypot(x - segment.x1, z - segment.z1) };
      }
      const t = clamp(((x - segment.x1) * dx + (z - segment.z1) * dz) / lengthSq, 0, 1);
      const px = segment.x1 + dx * t;
      const pz = segment.z1 + dz * t;
      return {
        x: px,
        z: pz,
        distance: Math.hypot(x - px, z - pz),
        t
      };
    }

    function nearestRoad(x, z, plan) {
      let best = null;
      plan.allRoadSegments.forEach((segment) => {
        const point = nearestPointOnSegment(x, z, segment);
        if (!best || point.distance < best.distance) {
          best = {
            ...point,
            segment
          };
        }
      });
      return best;
    }

    function createTerrainSystem(config, plan) {
      const phase1 = Math.random() * Math.PI * 2;
      const phase2 = Math.random() * Math.PI * 2;

      function baseHeight(x, z) {
        const broad =
          Math.sin(x * 0.075 + phase1) * 1.1 +
          Math.sin(z * 0.095 + phase2) * 0.85 +
          Math.sin((x + z) * 0.047 + phase1 * 1.7) * 0.55;
        const backFactor = clamp((-z + 8) / (WORLD.halfD + 8), 0, 1);
        const mountain = Math.pow(backFactor, 1.65) * 6.2 * config.terrainRelief;
        let height = 1.45 + broad * config.terrainRelief + mountain;

        const riverDistance = Math.abs(z - plan.riverZ);
        const riverCut = -1.52 * Math.exp(-Math.pow(riverDistance / (plan.riverWidth * 0.54), 4));
        height += riverCut;

        const tulouDistance = Math.hypot(x - config.tulouX, z - config.tulouZ);
        const tulouBase =
          1.9 +
          Math.sin(x * 0.05 + phase2) * 0.45 +
          Math.sin(z * 0.055 + phase1) * 0.35;
        const tulouBlend = 1 - smoothstep(config.radius * 0.82, config.radius + 8.5, tulouDistance);
        height = lerp(height, tulouBase, tulouBlend * 0.92);

        const pondDistance = Math.hypot(x - config.pondCenter.x, z - config.pondCenter.z);
        const pondBlend = 1 - smoothstep(config.pondRadius * 0.72, config.pondRadius + 5.2, pondDistance);
        height = lerp(height, tulouBase - 0.48, pondBlend * 0.92);

        return height;
      }

      function heightAt(x, z) {
        let height = baseHeight(x, z);
        const nearest = nearestRoad(x, z, plan);
        if (nearest) {
          const shoulder = Math.exp(-Math.pow(nearest.distance / (nearest.segment.width * 1.45), 2));
          height += shoulder * 0.09;
        }
        return height;
      }

      const waterY = 0.52 + config.terrainRelief * 0.12;
      return { baseHeight, heightAt, waterY };
    }

    function createTerrainMesh(materials, heightAt) {
      const geometry = new THREE.PlaneGeometry(
        WORLD.width,
        WORLD.depth,
        WORLD.cols - 1,
        WORLD.rows - 1
      );
      geometry.rotateX(-Math.PI * 0.5);

      const positions = geometry.attributes.position;
      for (let i = 0; i < positions.count; i += 1) {
        const x = positions.getX(i);
        const z = positions.getZ(i);
        positions.setY(i, heightAt(x, z));
      }
      positions.needsUpdate = true;
      geometry.computeVertexNormals();

      const terrain = new THREE.Mesh(geometry, materials.grass);
      terrain.receiveShadow = true;
      terrain.name = "terrain";
      return terrain;
    }

    function buildRibbonGeometry(segment, width, elevation, segmentCount = 38, uvScale = 12) {
      const positions = [];
      const uvs = [];
      const indices = [];
      const alongX = Math.abs(segment.x2 - segment.x1) > Math.abs(segment.z2 - segment.z1);
      const half = width * 0.5;

      for (let i = 0; i <= segmentCount; i += 1) {
        const t = i / segmentCount;
        const x = lerp(segment.x1, segment.x2, t);
        const z = lerp(segment.z1, segment.z2, t);
        const y = elevation(x, z, t);
        if (alongX) {
          positions.push(x, y, z - half, x, y, z + half);
        } else {
          positions.push(x - half, y, z, x + half, y, z);
        }
        uvs.push(t * uvScale, 0, t * uvScale, 1);

        if (i < segmentCount) {
          const offset = i * 2;
          indices.push(offset, offset + 2, offset + 1, offset + 1, offset + 2, offset + 3);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function createRoads(plan, materials, heightAt, waterY) {
      const group = new THREE.Group();
      group.name = "road-network";

      plan.roads.forEach((road) => {

        group.add(edge);

        const surface = new THREE.Mesh(

          materials.road

        surface.receiveShadow = true;
        group.add(surface);
      });

      const bridgeSurface = new THREE.Mesh(
        buildRibbonGeometry(
          plan.bridgeRoad,
          plan.mainRoadWidth + 0.8,
          (x, z) => Math.max(heightAt(x, z) + 0.18, waterY + 1.18),
          18,
          5

      bridgeSurface.receiveShadow = true;
      bridgeSurface.castShadow = true;
      group.add(bridgeSurface);

    function createBridge(plan, materials, heightAt, waterY) {
      const group = new THREE.Group();

    function createGableRoofGeometry(length, depth, height, overhang = 0.42) {
      const halfLength = length * 0.5 + overhang;
      const halfDepth = depth * 0.5 + overhang;
      const vertices = new Float32Array([
        -halfLength, 0, -halfDepth,
         halfLength, 0, -halfDepth,
         halfLength, 0,  halfDepth,
        -halfLength, 0,  halfDepth,
        -halfLength, height, 0,
         halfLength, height, 0
      ]);
      const indices = [
        0, 1, 5, 0, 5, 4,
        3, 4, 5, 3, 5, 2,
        0, 4, 3, 1, 2, 5,
        0, 3, 2, 0, 2, 1
      ];
      const uvs = new Float32Array([
        0, 0, 1, 0, 1, 1, 0, 1, 0, 0.5, 1, 0.5
      ]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
      geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function addRoof(group, length, depth, wallHeight, roofHeight, materials, options = {}) {
      const roof = new THREE.Mesh(
        createGableRoofGeometry(length, depth, roofHeight, options.overhang ?? 0.45),
        materials.roof
      );
      roof.position.y = wallHeight;
      roof.castShadow = true;
      roof.receiveShadow = true;
      group.add(roof);

      const ridge = new THREE.Mesh(
        cachedGeometry(
          "ridge-roof",
          () => new THREE.CylinderGeometry(0.11, 0.11, 1, 7, 1, false)
        ),
        materials.roofDark
      );
      ridge.scale.x = length + 0.75;
      ridge.rotation.z = Math.PI * 0.5;
      ridge.position.y = wallHeight + roofHeight;
      ridge.castShadow = true;
      group.add(ridge);

      const eaveGeometry = new THREE.BoxGeometry(length + 0.9, 0.13, 0.18);
      for (const side of [-1, 1]) {
        const eave = new THREE.Mesh(eaveGeometry, materials.roofDark);
        eave.position.set(0, wallHeight - 0.03, side * (depth * 0.5 + 0.48));
        group.add(eave);
      }

      if (options.detailedRoof) {
        const ribCount = clamp(Math.floor(length / 0.72), 5, 18);
        const ribGeometry = cachedGeometry(
          "roof-tile-rib",
          () => new THREE.BoxGeometry(0.065, 0.055, 1)
        );
        const ribs = new THREE.InstancedMesh(
          ribGeometry,
          materials.roofDark,
          ribCount * 2
        );
        const matrix = new THREE.Matrix4();
        const quaternion = new THREE.Quaternion();
        const position = new THREE.Vector3();
        const scale = new THREE.Vector3();
        const slopeLength = Math.hypot(depth * 0.5, roofHeight);
        const slopeAngle = Math.atan2(roofHeight, depth * 0.5);
        let index = 0;

        for (const side of [-1, 1]) {
          quaternion.setFromEuler(new THREE.Euler(side * slopeAngle, 0, 0));
          for (let i = 0; i < ribCount; i += 1) {
            position.set(
              -length * 0.5 + (i + 0.5) * length / ribCount,
              wallHeight + roofHeight * 0.5,
              side * depth * 0.25
            );
            scale.set(1, 1, slopeLength);
            matrix.compose(position, quaternion, scale);
            ribs.setMatrixAt(index, matrix);
            index += 1;
          }
        }
        ribs.instanceMatrix.needsUpdate = true;
        group.add(ribs);
      }

      return roof;
    }

    function createGableHouse(width, depth, wallHeight, materials, rng, options = {}) {
      const group = new THREE.Group();
      const decorationDensity = options.decorationDensity ?? 0.5;
      const plinthHeight = options.plinthHeight ?? 0.5;
      const roofHeight = options.roofHeight ?? randRange(rng, 1.15, 1.65);

      const plinth = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.38, plinthHeight, depth + 0.38),
        materials.stone
      );
      plinth.position.y = plinthHeight * 0.5;
      plinth.castShadow = true;
      plinth.receiveShadow = true;
      group.add(plinth);

      const walls = new THREE.Mesh(
        new THREE.BoxGeometry(width, wallHeight, depth),
        options.secondaryWall ? materials.wallSecondary : materials.wall
      );
      walls.position.y = plinthHeight + wallHeight * 0.5;
      walls.castShadow = true;
      walls.receiveShadow = true;
      group.add(walls);

      addRoof(
        group,
        width,
        depth,
        plinthHeight + wallHeight,
        roofHeight,
        materials,
        {
          overhang: options.overhang ?? 0.5,
          detailedRoof: options.detailedRoof ?? false
        }
      );

      if (options.door !== false) {
        createDoor(
          group,
          Math.min(1.55, width * 0.28),
          Math.min(2.15, wallHeight * 0.72),
          depth * 0.5 + 0.12,
          materials,
          decorationDensity,
          rng
        );
      }

      const windowY = plinthHeight + wallHeight * 0.56;
      createWindow(
        group,
        -width * 0.3,
        windowY,
        depth * 0.5 + 0.08,
        0,
        materials,
        decorationDensity
      );
      createWindow(
        group,
        width * 0.3,
        windowY,
        depth * 0.5 + 0.08,
        0,
        materials,
        decorationDensity
      );

      if (decorationDensity > 0.62) {
        const frieze = new THREE.Mesh(
          new THREE.BoxGeometry(width * 0.9, 0.28, 0.14),
          rng() > 0.5 ? materials.paintedTeal : materials.paintedRed
        );
        frieze.position.set(0, plinthHeight + wallHeight - 0.2, depth * 0.5 + 0.16);
        group.add(frieze);
      }

      group.userData.footprintRadius = Math.max(width, depth) * 0.5;
      group.userData.wallHeight = wallHeight + plinthHeight;
      return group;
    }

    function createHuaTai(config, materials, rng) {
      // 化胎属于堂横屋与最内围龙之间的固定礼仪空间；增建二围、三围时
      // 只向外扩展围龙，不能继续侵占化胎，否则会失去围龙屋的核心轮廓。
      const ringSpacing = 4.7;
      const innermostRingRadius = config.radius - (config.ringCount - 1) * ringSpacing;
      const innerRadius = Math.max(3.1, innermostRingRadius * 0.44);
      const outerRadius = Math.max(
        innerRadius + 1.8,
        innermostRingRadius - 2.35
      );
      const group = new THREE.Group();
      group.name = "huatai-cobblestone";

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(innerRadius, outerRadius, 64, 5, 0, Math.PI),
        materials.cobble
      );
      ring.rotation.x = -Math.PI * 0.5;
      ring.position.y = 0.13;
      ring.receiveShadow = true;
      group.add(ring);

      const pebbleGeometry = cachedGeometry(
        "huatai-pebble",
        () => new THREE.DodecahedronGeometry(0.11, 0)
      );
      const pebbleCount = Math.round(42 + config.decorationDensity * 48);
      const pebbles = new THREE.InstancedMesh(pebbleGeometry, materials.carvedStone, pebbleCount);
      const matrix = new THREE.Matrix4();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      const position = new THREE.Vector3();

      for (let i = 0; i < pebbleCount; i += 1) {
        const theta = rng() * Math.PI;
        const radius = Math.sqrt(
          lerp(innerRadius * innerRadius, outerRadius * outerRadius, rng())
        );
        position.set(
          Math.cos(theta) * radius,
          0.25 + rng() * 0.035,
          -Math.sin(theta) * radius
        );
        quaternion.setFromEuler(
          new THREE.Euler(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI)
        );
        const pebbleScale = randRange(rng, 0.55, 1.35);
        scale.set(pebbleScale * 1.5, pebbleScale * 0.45, pebbleScale);
        matrix.compose(position, quaternion, scale);
        pebbles.setMatrixAt(i, matrix);
      }
      pebbles.receiveShadow = true;
      group.add(pebbles);

      return group;
    }

      halls.forEach((hall, hallIndex) => {
        const platform = new THREE.Mesh(
          new THREE.BoxGeometry(hall.width + 0.8, hall.baseY + 0.28, hall.depth + 0.72),
          hallIndex === 0 ? materials.stone : materials.carvedStone
        );
        platform.position.set(0, (hall.baseY + 0.28) * 0.5, hall.z);
        platform.receiveShadow = true;
        platform.castShadow = true;
        group.add(platform);

        const hallGroup = createGableHouse(
          hall.width,
          hall.depth,
          hall.wallHeight,
          materials,
          rng,
          {
            decorationDensity: config.decorationDensity * (1 - hallIndex * 0.06),
            roofHeight: hall.roofHeight,
            door: true,
            secondaryWall: hall.secondaryWall,
            detailedRoof: true
          }
        );
        hallGroup.position.set(0, hall.baseY + 0.28, hall.z);
        hallGroup.name = `central-hall-${hallIndex + 1}`;
        group.add(hallGroup);

        const axisStone = new THREE.Mesh(
          new THREE.BoxGeometry(2.35, 0.12, hall.depth + 1.2),
          materials.carvedStone
        );
        axisStone.position.set(0, hall.baseY + 0.34, hall.z + hall.depth * 0.5 + 0.55);
        axisStone.receiveShadow = true;
        group.add(axisStone);
      });

      // “两横”：东西横屋严格镜像，每侧再由堂横屋数量形成连续横屋。
      const wingDepth = 7.8;
      const wingStart = 6.65;
      for (const side of [-1, 1]) {
        for (let i = 0; i < config.wingCount; i += 1) {
          const sectionWidth = randRange(rng, 2.55, 3.2);
          const wing = createGableHouse(sectionWidth, wingDepth, 2.75, materials, rng, {
            decorationDensity: config.decorationDensity * 0.62,
            roofHeight: 0.95,
            door: false,
            secondaryWall: true
          });
          wing.rotation.y = Math.PI * 0.5;
          wing.position.set(
            side * (wingStart + i * 2.55),
            0,
            -0.2
          );
          wing.name = `horizontal-wing-${side > 0 ? "east" : "west"}-${i + 1}`;
          group.add(wing);
        }
      }

      for (let i = 0; i < config.courtyardCount; i += 1) {
        const courtyardZ = [2.2, -2.1, -7.2][i % 3] + randRange(rng, -0.35, 0.35);
        const court = new THREE.Mesh(
          new THREE.BoxGeometry(2.35, 0.12, 1.55),
          materials.carvedStone
        );
        court.position.set(randRange(rng, -2.8, 2.8), 0.23, courtyardZ);
        court.receiveShadow = true;
        group.add(court);

        const drain = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 0.07, 0.14),
          materials.blackOpening
        );
        drain.position.set(court.position.x, 0.25, court.position.z);
        group.add(drain);
      }

      group.add(createHuaTai(config, materials, rng));

      const ringRadii = [];
      for (let i = 0; i < config.ringCount; i += 1) {
        ringRadii.push(config.radius - i * 4.7);
      }
      ringRadii.sort((a, b) => a - b);

      ringRadii.forEach((radius, ringIndex) => {
        // 每一围先铺一圈石基与檐廊，再把屋段排成同心半圆，轮廓更清晰。
        const ringBand = new THREE.Mesh(
          new THREE.RingGeometry(
            Math.max(1.4, radius - 2.45),
            radius + 1.38,
            72,
            2,
            0,
            Math.PI
          ),
          ringIndex % 2 === 0 ? materials.stone : materials.cobble
        );
        ringBand.rotation.x = -Math.PI * 0.5;
        ringBand.position.y = 0.12 + ringIndex * 0.018;
        ringBand.receiveShadow = true;
        group.add(ringBand);

        const count = Math.round(radius * 1.42 + 4);
        for (let i = 0; i < count; i += 1) {
          const t = (i + 0.5) / count * Math.PI;
          const x = Math.cos(t) * radius;
          const z = -Math.sin(t) * radius;
          const tangentX = -Math.sin(t);
          const tangentZ = -Math.cos(t);
          const segmentLength = (Math.PI * radius / count) * 1.08;
          const wallHeight = 3.02 - ringIndex * 0.23 + randRange(rng, -0.12, 0.12);
          const ringHouse = createGableHouse(
            segmentLength,
            randRange(rng, 2.65, 3.45),
            wallHeight,
            materials,
            rng,
            {
              decorationDensity: config.decorationDensity * 0.42,
              roofHeight: randRange(rng, 0.78, 1.12),
              door: rng() > 0.24,
              secondaryWall: (i + ringIndex) % 3 !== 0,
              plinthHeight: 0.34,
              overhang: 0.28,
              detailedRoof: false
            }
          );
          ringHouse.position.set(x, 0.08 + ringIndex * 0.025, z);
          // 围龙屋段的门面朝向中轴堂屋，而不是朝山外。
          ringHouse.rotation.y = Math.atan2(-tangentZ, tangentX) + Math.PI;
          group.add(ringHouse);
        }
      });

      addTulouDecoration(group, config, materials, rng, halls[0].z, halls[0].width);

      return group;
    }

    function createPondShape(shapeName, radius) {
      const shape = new THREE.Shape();
      if (shapeName === "圆形") {
        shape.absarc(0, 0, radius, 0, Math.PI * 2, false);
      } else if (shapeName === "半月形") {
        shape.moveTo(-radius, 0);
        shape.absarc(0, 0, radius, Math.PI, Math.PI * 2, false);
        shape.lineTo(-radius, 0);
      } else {
        shape.moveTo(0, radius * 1.18);
        shape.bezierCurveTo(
          radius * 1.05,
          radius * 0.86,
          radius * 1.18,
          radius * 0.12,
          radius * 0.44,
          -radius * 0.38
        );
        shape.bezierCurveTo(
          radius * 0.06,
          -radius * 0.6,
          -radius * 0.06,
          -radius * 0.6,
          -radius * 0.44,
          -radius * 0.38
        );
        shape.bezierCurveTo(
          -radius * 1.18,
          radius * 0.12,
          -radius * 1.05,
          radius * 0.86,
          0,
          radius * 1.18
        );
      }
      return shape;
    }

    function createFengshuiPond(config, materials, rng, waterY) {
      const group = new THREE.Group();
      group.name = "fengshui-pond";
      const shape = createPondShape(config.pondShape, config.pondRadius);
      const shapeGeometry = new THREE.ShapeGeometry(shape, 48);
      shapeGeometry.rotateX(-Math.PI * 0.5);

      const mud = new THREE.Mesh(shapeGeometry.clone(), materials.waterDark);
      mud.scale.setScalar(1.08);
      mud.position.y = -0.16;
      mud.receiveShadow = true;
      group.add(mud);

      const pondMaterial = materials.water.clone();
      applyWaterWave(pondMaterial, 0.075);
      pondMaterial.map = pondMaterial.map.clone();
      pondMaterial.map.wrapS = THREE.RepeatWrapping;
      pondMaterial.map.wrapT = THREE.RepeatWrapping;
      pondMaterial.map.repeat.set(3.8, 2.2);
      pondMaterial.opacity = 0.75;
      pondMaterial.normalMap = pondMaterial.map;
      state.waterTextures.push(pondMaterial.map);
      state.waterMaterials.push(pondMaterial);

      const water = new THREE.Mesh(shapeGeometry.clone(), pondMaterial);
      water.position.y = 0.03;
      water.renderOrder = 2;
      group.add(water);

      const points = shape.extractPoints(40).shape.map(
        (point) => new THREE.Vector3(point.x, 0.07, -point.y)
      );
      if (points.length > 2 && points[0].distanceTo(points[points.length - 1]) < 0.0001) {
        points.pop();
      }
      const rimGroup = new THREE.Group();
      const rimSegmentGeometry = cachedGeometry(
        "pond-rim-segment",
        () => new THREE.CylinderGeometry(0.2, 0.2, 1, 7, 1, false)
      );
      const up = new THREE.Vector3(0, 1, 0);
      for (let i = 0; i < points.length; i += 1) {
        const start = points[i];
        const end = points[(i + 1) % points.length];
        const direction = end.clone().sub(start);
        const segmentLength = direction.length();
        if (segmentLength < 0.0001) {
          continue;
        }
        const segment = new THREE.Mesh(rimSegmentGeometry, materials.carvedStone);
        segment.position.copy(start).add(end).multiplyScalar(0.5);
        segment.scale.y = segmentLength * 1.04;
        segment.quaternion.setFromUnitVectors(up, direction.normalize());
        segment.castShadow = true;
        rimGroup.add(segment);
      }
      group.add(rimGroup);

      const rockGeometry = cachedGeometry(
        "pond-rock",
        () => new THREE.DodecahedronGeometry(0.38, 0)
      );
      for (let i = 0; i < 12; i += 1) {
        const angle = rng() * Math.PI * 2;
        const radius = config.pondRadius * randRange(rng, 0.85, 1.08);
        const rock = new THREE.Mesh(rockGeometry, materials.stone);
        rock.position.set(
          Math.cos(angle) * radius,
          0.1,
          Math.sin(angle) * radius
        );
        rock.scale.set(
          randRange(rng, 0.5, 1.45),
          randRange(rng, 0.35, 0.85),
          randRange(rng, 0.5, 1.4)
        );
        rock.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
        rock.castShadow = true;
        group.add(rock);
      }

      group.position.set(
        config.pondCenter.x,
        waterY,
        config.pondCenter.z
      );

      return {
        group,
        center: config.pondCenter,
        radius: config.pondRadius,
        shapeName: config.pondShape
      };
    }

    function markExternalModel(object) {
      object.traverse((child) => {
        child.userData.externalModel = true;
      });
    }

    function instantiateExternalModel(key, options = {}) {
      if (!ui.useGLB.checked || !state.models.has(key)) {
        return null;
      }

      const source = state.models.get(key);
      const root = new THREE.Group();
      const orientation = new THREE.Group();
      const instance = source.clone(true);
      orientation.rotation.y = ASSET_MANIFEST[key]?.forwardOffset ?? 0;
      orientation.add(instance);
      root.add(orientation);

      root.updateMatrixWorld(true);
      let bounds = new THREE.Box3().setFromObject(orientation);
      if (bounds.isEmpty()) {
        return null;
      }

      const size = bounds.getSize(new THREE.Vector3());
      const measured = options.axis === "height"
        ? Math.max(size.y, 0.001)
        : Math.max(size.x, size.z, 0.001);
      const scale = (options.target ?? measured) / measured;
      orientation.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      bounds = new THREE.Box3().setFromObject(orientation);
      const center = bounds.getCenter(new THREE.Vector3());
      orientation.position.x -= center.x;
      orientation.position.z -= center.z;
      orientation.position.y -= bounds.min.y;
      orientation.position.y += options.yOffset ?? 0;

      markExternalModel(root);
      root.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            const materials = Array.isArray(child.material) ? child.material : [child.material];
            materials.forEach((material) => {
              if ("roughness" in material && options.roughness) {
                material.roughness = options.roughness;
              }
            });
          }
        }
      });
      root.userData.modelKey = key;
      root.userData.isExternal = true;
      return root;
    }

    function createTulouArea(config, materials, rng, heightAt) {
      const group = new THREE.Group();
      group.name = "weilongwu-area";
      group.position.set(config.tulouX, heightAt(config.tulouX, config.tulouZ) + 0.08, config.tulouZ);

      const externalKey = `weiwu_${config.ringCount}`;
      // 优先级：完整 3ds Max GLB -> 当前围数模型 -> 通用围龙屋 -> 程序化模型。
      let external = instantiateExternalModel("village", {
        target: (config.radius + 3.1) * 2,
        yOffset: 0.12
      });
      if (!external) {
        external = instantiateExternalModel(externalKey, {
          target: (config.radius + 3.1) * 2,
          yOffset: 0.12
        });
      }
      if (!external && state.models.has("weiwu")) {
        external = instantiateExternalModel("weiwu", {
          target: (config.radius + 3.1) * 2,
          yOffset: 0.12
        });
      }

      if (external) {
        group.add(external);
        const ground = new THREE.Mesh(
          new THREE.CylinderGeometry(config.radius + 2.3, config.radius + 2.45, 0.24, 64),
          materials.cobble
        );
        ground.position.y = -0.02;
        ground.receiveShadow = true;
        group.add(ground);
      } else {
        group.add(createProceduralTulou(config, materials, rng));
      }

      const pond = createFengshuiPond(config, materials, rng, heightAt(config.pondCenter.x, config.pondCenter.z) - 0.08);

      const forestCenter = {
        x: config.tulouX,
        z: config.tulouZ - config.radius - 7.4
      };

      return {
        group,
        pond,
        forestCenter,
        radius: config.radius,
        isExternal: Boolean(external)
      };
    }

    function createPagoda(config, materials, rng, heightAt) {
      const external = instantiateExternalModel("fengshuita", {
        target: 10.8,
        axis: "height"
      });
      if (external) {
        external.name = "hakka-fengshui-pagoda";
        return external;
      }

      const group = new THREE.Group();
      group.name = "hakka-fengshui-pagoda";
      const sides = config.pagodaSides;
      const floorCount = config.pagodaFloors;
      let currentY = 0;
      let radius = 3.15;

      const terrace = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 1.36, radius * 1.52, 0.55, sides),
        materials.carvedStone
      );
      terrace.position.y = 0.275;
      terrace.castShadow = true;
      terrace.receiveShadow = true;

      currentY += 0.46;

      const step = new THREE.Mesh(
        new THREE.BoxGeometry(2.1, 0.28, 1.2),
        materials.carvedStone
      );
      step.position.set(0, 0.25, radius * 1.2);
      step.castShadow = true;
      group.add(step);

      for (let floor = 0; floor < floorCount; floor += 1) {
        const floorHeight = lerp(1.72, 1.16, floor / Math.max(floorCount - 1, 1));
        const taper = 0.88 - floor * 0.045;
        radius *= taper;

        const wall = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.94, radius, floorHeight, sides, 1, false),
          floor % 3 === 0 ? materials.wall : materials.wallSecondary
        );
        wall.position.y = currentY + floorHeight * 0.5;
        wall.castShadow = true;
        wall.receiveShadow = true;
        group.add(wall);

        const doorway = new THREE.Mesh(
          new THREE.BoxGeometry(
            Math.max(0.58, radius * 0.26),
            floor === 0 ? Math.min(1.78, floorHeight * 0.88) : Math.min(0.82, floorHeight * 0.54),
            0.14
          ),
          materials.blackOpening
        );
        doorway.position.set(
          0,
          currentY + (floor === 0 ? 0.92 : floorHeight * 0.54),
          radius + 0.05
        );
        group.add(doorway);

        const eave = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 1.32, radius * 0.82, 0.32, sides),
          materials.roof
        );
        eave.position.y = currentY + floorHeight + 0.06;
        eave.castShadow = true;
        group.add(eave);

        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(radius * 1.12, 0.74, sides),
          materials.roofDark
        );
        roof.position.y = currentY + floorHeight + 0.48;
        roof.castShadow = true;
        group.add(roof);

        const railing = new THREE.Mesh(
          new THREE.TorusGeometry(radius * 1.04, 0.065, 6, sides * 3),
          materials.carvedStone
        );
        railing.rotation.x = Math.PI * 0.5;
        railing.position.y = currentY + 0.12;
        group.add(railing);

        if (floor % 2 === 0) {
          const lamp = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.18, 0),
            materials.gold
          );
          lamp.position.set(radius * 0.95, currentY + floorHeight * 0.72, 0.2);
          group.add(lamp);
        }

        currentY += floorHeight + 0.62;
      }

      const cap = new THREE.Mesh(
        new THREE.ConeGeometry(radius * 1.2, 1.35, sides),
        materials.roofDark
      );
      cap.position.y = currentY + 0.28;
      cap.castShadow = true;
      group.add(cap);

      const finialStem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.12, 1.35, 8),
        materials.gold
      );
      finialStem.position.y = currentY + 1.54;
      group.add(finialStem);

      for (let i = 0; i < 4; i += 1) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.25 + i * 0.07, 0.035, 6, 18),
          materials.gold
        );
        ring.rotation.x = Math.PI * 0.5;
        ring.position.y = currentY + 1.35 + i * 0.18;
        group.add(ring);
      }

      group.userData.height = currentY + 2.1;
      group.userData.sides = sides;
      group.userData.floors = floorCount;
      return group;
    }
