    function housePart(material, position, scale, options = {}) {
      return {
        material,
        position,
        scale,
        rotation: options.rotation ?? [0, 0, 0],
        geometry: options.geometry ?? "box"
      };
    }

    function addGableHouseParts(parts, options) {
      const {
        x = 0,
        z = 0,
        width,
        depth,
        wallHeight,
        roofHeight,
        baseY = 0,
        rotationY = 0,
        wallMaterial = "wall",
        decorationDensity = 0.5,
        door = false,
        windows = true,
        plinthHeight = 0.46
      } = options;

      const y0 = baseY + plinthHeight;
      parts.push(
        housePart("stone", [x, baseY + plinthHeight * 0.5, z], [width + 0.36, plinthHeight, depth + 0.36], {
          rotation: [0, rotationY, 0]
        }),
        housePart(wallMaterial, [x, y0 + wallHeight * 0.5, z], [width, wallHeight, depth], {
          rotation: [0, rotationY, 0]
        }),
        housePart("roof", [x, y0 + wallHeight, z], [width + 0.95, roofHeight, depth + 0.95], {
          rotation: [0, rotationY, 0],
          geometry: "roof"
        }),
        housePart("roofDark", [x, y0 + wallHeight + roofHeight, z], [width + 0.88, 0.12, 0.15], {
          rotation: [0, rotationY, 0]
        })
      );

      const front = new THREE.Vector3(0, 0, depth * 0.5 + 0.12);
      front.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY);

      if (door) {
        const doorWidth = Math.min(1.5, width * 0.28);
        const doorHeight = Math.min(2.03, wallHeight * 0.72);
        const doorCenter = new THREE.Vector3(0, y0 + doorHeight * 0.5, depth * 0.5 + 0.15);
        doorCenter.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY);
        parts.push(
          housePart("blackOpening", [x + doorCenter.x, doorCenter.y, z + doorCenter.z], [doorWidth, doorHeight, 0.16], {
            rotation: [0, rotationY, 0]
          }),
          housePart("carvedWood", [
            x + front.x - Math.cos(rotationY) * doorWidth * 0.5,
            y0 + doorHeight * 0.5,
            z + front.z + Math.sin(rotationY) * doorWidth * 0.5
          ], [0.16, doorHeight + 0.28, 0.2], {
            rotation: [0, rotationY, 0]
          }),
          housePart("carvedWood", [
            x + front.x + Math.cos(rotationY) * doorWidth * 0.5,
            y0 + doorHeight * 0.5,
            z + front.z - Math.sin(rotationY) * doorWidth * 0.5
          ], [0.16, doorHeight + 0.28, 0.2], {
            rotation: [0, rotationY, 0]
          }),
          housePart("carvedWood", [
            x + front.x,
            y0 + doorHeight + 0.28,
            z + front.z
          ], [doorWidth + 0.55, 0.2, 0.22], {
            rotation: [0, rotationY, 0]
          })
        );
      }

      if (windows) {
        for (const side of [-1, 1]) {
          const windowLocal = new THREE.Vector3(
            side * width * 0.3,
            y0 + wallHeight * 0.56,
            depth * 0.5 + 0.12
          );
          windowLocal.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY);
          parts.push(
            housePart("blackOpening", [x + windowLocal.x, windowLocal.y, z + windowLocal.z], [0.86, 0.76, 0.12], {
              rotation: [0, rotationY, 0]
            }),
            housePart("carvedWood", [x + windowLocal.x, windowLocal.y, z + windowLocal.z - 0.05], [1.0, 0.92, 0.1], {
              rotation: [0, rotationY, 0]
            })
          );
        }
      }

      if (decorationDensity > 0.62) {
        const friezeLocal = new THREE.Vector3(0, y0 + wallHeight - 0.18, depth * 0.5 + 0.16);
        friezeLocal.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY);
        parts.push(
          housePart(
            decorationDensity > 0.8 ? "paintedTeal" : "paintedRed",
            [x + friezeLocal.x, friezeLocal.y, z + friezeLocal.z],
            [width * 0.86, 0.25, 0.13],
            { rotation: [0, rotationY, 0] }
          )
        );
      }
    }

    function createHouseSpec(type, rng, config) {
      const parts = [];
      if (type === "diantang") {
        const width = randRange(rng, 11.2, 14);
        const depth = randRange(rng, 8.8, 11.2);
        const wingWidth = 2.7;
        const wingDepth = depth * 0.6;

        addGableHouseParts(parts, {
          z: depth * 0.5 - 1.75,
          width,
          depth: 3.5,
          wallHeight: 3.0,
          roofHeight: 1.16,
          wallMaterial: "wall",
          decorationDensity: config.decorationDensity,
          door: true
        });
        addGableHouseParts(parts, {
          z: -depth * 0.5 + 2.05,
          width: width * 0.82,
          depth: 4.0,
          wallHeight: 3.58,
          roofHeight: 1.4,
          wallMaterial: "wallSecondary",
          decorationDensity: config.decorationDensity * 0.82,
          door: false,
          windows: true
        });
        for (const side of [-1, 1]) {
          addGableHouseParts(parts, {
            x: side * (width * 0.5 - wingWidth * 0.5),
            width: wingWidth,
            depth: wingDepth,
            wallHeight: 2.82,
            roofHeight: 0.94,
            rotationY: Math.PI * 0.5,
            wallMaterial: "wallSecondary",
            decorationDensity: config.decorationDensity * 0.5,
            door: false,
            windows: false
          });
        }
        parts.push(
          housePart("cobble", [0, 0.14, 0], [width * 0.48, 0.12, depth * 0.4])
        );
        return {
          type,
          width,
          depth,
          radius: Math.max(width, depth) * 0.56,
          parts
        };
      }

      const width = randRange(rng, 7.4, 11.3);
      const depth = randRange(rng, 4.2, 5.5);
      const wallHeight = randRange(rng, 2.75, 3.3);
      const roofHeight = randRange(rng, 1.05, 1.4);
      const annex = rng() > 0.48 ? randRange(rng, 2.1, 3.5) : 0;
      addGableHouseParts(parts, {
        width,
        depth,
        wallHeight,
        roofHeight,
        wallMaterial: rng() > 0.58 ? "wall" : "wallSecondary",
        decorationDensity: config.decorationDensity,
        door: true
      });

      if (annex > 0) {
        addGableHouseParts(parts, {
          x: width * 0.5 + annex * 0.5 - 0.05,
          width: annex,
          depth: depth * 1.05,
          wallHeight: wallHeight * 0.86,
          roofHeight: 0.82,
          wallMaterial: "wallSecondary",
          decorationDensity: config.decorationDensity * 0.4,
          door: false,
          windows: false
        });
      }

      return {
        type,
        width,
        depth,
        radius: annex > 0
          ? Math.max(width * 0.5 + annex, depth * 0.5) * 0.92
          : Math.max(width, depth) * 0.5,
        parts
      };
    }

    function buildInstancedHouseBatches(houseSpecs, materials) {
      const group = new THREE.Group();
      group.name = "instanced-houses";
      const batches = new Map();

      houseSpecs.forEach((house) => {
        const houseMatrix = new THREE.Matrix4().compose(
          new THREE.Vector3(house.x, house.y, house.z),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, house.yaw, 0)),
          new THREE.Vector3(1, 1, 1)
        );

        house.spec.parts.forEach((part) => {
          const key = `${part.geometry}:${part.material}`;
          if (!batches.has(key)) {
            batches.set(key, {
              geometry: part.geometry,
              material: part.material,
              matrices: []
            });
          }
          const localMatrix = new THREE.Matrix4().compose(
            new THREE.Vector3().fromArray(part.position),
            new THREE.Quaternion().setFromEuler(new THREE.Euler().fromArray(part.rotation)),
            new THREE.Vector3().fromArray(part.scale)
          );
          const worldMatrix = new THREE.Matrix4().multiplyMatrices(houseMatrix, localMatrix);
          batches.get(key).matrices.push(worldMatrix);
        });
      });

      batches.forEach((batch, key) => {
        const geometry = batch.geometry === "roof"
          ? cachedGeometry(
            "unit-gable-roof",
            () => createGableRoofGeometry(1, 1, 1, 0)
          )
          : cachedGeometry(
            "unit-box",
            () => new THREE.BoxGeometry(1, 1, 1)
          );
        const material = materials[batch.material] ?? materials.wall;
        const mesh = new THREE.InstancedMesh(
          geometry,
          material,
          batch.matrices.length
        );
        batch.matrices.forEach((matrix, index) => mesh.setMatrixAt(index, matrix));
        mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = !key.startsWith("box:blackOpening");
        mesh.receiveShadow = true;
        mesh.name = `house-batch-${key.replace(":", "-")}`;
        mesh.computeBoundingSphere();
        group.add(mesh);
      });

      return group;
    }

    function sampleNearRoad(rng, plan) {
      const segment = choice(rng, plan.roads);
      const t = randRange(rng, 0.08, 0.92);
      const x = lerp(segment.x1, segment.x2, t);
      const z = lerp(segment.z1, segment.z2, t);
      const distance = randRange(rng, 8.5, 17.5);
      const sign = rng() > 0.5 ? 1 : -1;
      if (segment.axis === "x") {
        return { x, z: z + sign * distance };
      }
      return { x: x + sign * distance, z };
    }

    function isInsideWorld(x, z, margin) {
      return x > -WORLD.halfW + margin &&
        x < WORLD.halfW - margin &&
        z > -WORLD.halfD + margin &&
        z < WORLD.halfD - margin;
    }

    function zoneDistance(x, z, zone) {
      return Math.hypot(x - zone.x, z - zone.z) - zone.r;
    }

    function isZoneClear(x, z, radius, zones, ignoredType = "") {
      return zones.every((zone) => {
        if (zone.type === ignoredType) {
          return true;
        }
        return zoneDistance(x, z, zone) >= radius;
      });
    }

    function terrainSlope(heightAt, x, z, sample = 2.2) {
      const center = heightAt(x, z);
      return Math.max(
        Math.abs(heightAt(x + sample, z) - center),
        Math.abs(heightAt(x - sample, z) - center),
        Math.abs(heightAt(x, z + sample) - center),
        Math.abs(heightAt(x, z - sample) - center)
      );
    }

    function placeHouses(config, plan, materials, rng, heightAt, reservedZones) {
      const houses = [];
      const claimed = [];
      let attempts = 0;
      const hardAttemptLimit = WORLD.maxPlacementAttempts;

      function tryPlaceHouse(candidate, type, options = {}) {
        if (attempts >= hardAttemptLimit || houses.length >= config.houseCountTarget) {
          return false;
        }
        attempts += 1;

        if (!isInsideWorld(candidate.x, candidate.z, 5.5)) {
          return false;
        }

        const spec = createHouseSpec(type, rng, config);
        const radius = spec.radius;
        const nearest = nearestRoad(candidate.x, candidate.z, plan);
        if (!nearest || nearest.distance < radius + (options.minRoadPadding ?? 2.1)) {
          return false;
        }

        if (!isZoneClear(candidate.x, candidate.z, radius + 1.05, reservedZones)) {
          return false;
        }

        for (const claimedHouse of claimed) {
          const required = radius + claimedHouse.radius + WORLD.cell;
          if (Math.hypot(candidate.x - claimedHouse.x, candidate.z - claimedHouse.z) < required) {
            return false;
          }
        }

        const slope = terrainSlope(heightAt, candidate.x, candidate.z);
        if (!options.allowSteep && slope > 2.5 * config.terrainRelief) {
          return false;
        }

        const roadDx = nearest.x - candidate.x;
        const roadDz = nearest.z - candidate.z;
        const record = {
          object: null,
          x: candidate.x,
          z: candidate.z,
          y: heightAt(candidate.x, candidate.z) + 0.04,
          radius,
          yaw: Math.atan2(roadDx, roadDz),
          type,
          spec,
          external: false,
          nearestRoadDistance: nearest.distance
        };
        houses.push(record);
        claimed.push(record);
        reservedZones.push({
          x: candidate.x,
          z: candidate.z,
          r: radius + WORLD.cell,
          type: "house"
        });
        return true;
      }

      const strictAttemptLimit = Math.min(3600, hardAttemptLimit);
      while (houses.length < config.houseCountTarget && attempts < strictAttemptLimit) {
        const candidate = sampleNearRoad(rng, plan);
        const type = rng() > 0.36 ? "gangwu" : "diantang";
        tryPlaceHouse(candidate, type);
      }

      // 保底规则：随机采样耗尽后，沿正交道路生成结构化候选点，
      // 仍保留隔离、避让和门朝道路约束，只放宽地形坡度限制。
      const fallbackTarget = Math.min(config.houseCountTarget, 6);
      if (houses.length < fallbackTarget) {
        const fallbackLimit = Math.min(
          hardAttemptLimit,
          Math.max(attempts + 1200, 2400)
        );
        for (let pass = 0; pass < 3 && houses.length < fallbackTarget && attempts < fallbackLimit; pass += 1) {
          for (const segment of plan.allRoadSegments) {
            if (houses.length >= fallbackTarget || attempts >= fallbackLimit) {
              break;
            }
            const alongX = segment.axis === "x";
            const length = Math.hypot(
              segment.x2 - segment.x1,
              segment.z2 - segment.z1
            );
            const steps = Math.max(3, Math.floor(length / 9));
            for (let step = 0; step < steps; step += 1) {
              const t = (step + 0.5) / steps;
              const anchorX = lerp(segment.x1, segment.x2, t);
              const anchorZ = lerp(segment.z1, segment.z2, t);
              for (const side of [-1, 1]) {
                const offset = 7.2 + pass * 2.8;
                const candidate = alongX
                  ? { x: anchorX, z: anchorZ + side * offset }
                  : { x: anchorX + side * offset, z: anchorZ };
                const type = (step + pass) % 5 === 0 ? "diantang" : "gangwu";
                if (tryPlaceHouse(candidate, type, {
                  allowSteep: true,
                  minRoadPadding: 1.85
                }) && houses.length >= fallbackTarget) {
                  break;
                }
              }
            }
          }
        }
      }

      if (houses.length === 0) {
        console.warn("房屋保底生成失败，已保留围龙屋并继续生成其余图层。");
      }

      const houseBatch = buildInstancedHouseBatches(houses, materials);
      worldRoot.add(houseBatch);
      houses.forEach((house) => {
        house.object = houseBatch;
      });

      return houses;
    }

    function createFarmPlot(width, depth, materials, rng) {
      const group = new THREE.Group();
      group.name = "farmland";

      const soil = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.2, depth),
        materials.soil
      );
      soil.position.y = 0.08;
      soil.receiveShadow = true;
      group.add(soil);

      const rowCount = Math.max(3, Math.floor(depth / 0.78));
      const cropGeometry = cachedGeometry(
        "rice-crop",
        () => new THREE.ConeGeometry(0.12, 0.54, 5)
      );
      const perRow = Math.max(3, Math.floor(width / 0.7));
      const crops = new THREE.InstancedMesh(
        cropGeometry,
        materials.crop,
        rowCount * perRow
      );
      const matrix = new THREE.Matrix4();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      const position = new THREE.Vector3();
      let index = 0;

      for (let row = 0; row < rowCount; row += 1) {
        const z = -depth * 0.5 + (row + 0.5) * depth / rowCount;
        for (let column = 0; column < perRow; column += 1) {
          const x = -width * 0.5 + (column + 0.5) * width / perRow;
          position.set(
            x + (rng() - 0.5) * 0.12,
            0.45,
            z + (rng() - 0.5) * 0.1
          );
          scale.set(
            randRange(rng, 0.72, 1.12),
            randRange(rng, 0.8, 1.3),
            randRange(rng, 0.72, 1.12)
          );
          matrix.compose(position, quaternion, scale);
          crops.setMatrixAt(index, matrix);
          index += 1;
        }
      }
      crops.castShadow = true;
      group.add(crops);

      return group;
    }

    function buildInstancedFarmBatches(farms, materials, rng) {
      const group = new THREE.Group();
      group.name = "instanced-farmland";
      let cropTotal = 0;
      let rowTotal = 0;
      farms.forEach((farm) => {
        farm.rowCount = Math.max(3, Math.floor(farm.depth / 0.78));
        farm.perRow = Math.max(3, Math.floor(farm.width / 0.7));
        cropTotal += farm.rowCount * farm.perRow;
        rowTotal += farm.rowCount;
      });

      const soil = new THREE.InstancedMesh(
        cachedGeometry("unit-box", () => new THREE.BoxGeometry(1, 1, 1)),
        materials.soil,
        farms.length
      );
      const rows = new THREE.InstancedMesh(
        cachedGeometry("farm-row-guide", () => new THREE.BoxGeometry(1, 0.025, 1)),
        materials.roadEdge,
        rowTotal
      );
      const crops = new THREE.InstancedMesh(
        cachedGeometry(
          "rice-crop",
          () => new THREE.ConeGeometry(0.12, 0.54, 5)
        ),
        materials.crop,
        cropTotal
      );

      const matrix = new THREE.Matrix4();
      const quaternion = new THREE.Quaternion();
      const position = new THREE.Vector3();
      const scale = new THREE.Vector3();
      const color = new THREE.Color();
      let cropIndex = 0;
      let rowIndex = 0;

      farms.forEach((farm) => {
        quaternion.setFromEuler(new THREE.Euler(0, farm.yaw, 0));
        position.set(farm.x, farm.y + 0.08, farm.z);
        scale.set(farm.width, 0.2, farm.depth);
        matrix.compose(position, quaternion, scale);
        soil.setMatrixAt(farms.indexOf(farm), matrix);

        for (let row = 0; row < farm.rowCount; row += 1) {
          const localZ = -farm.depth * 0.5 + (row + 0.5) * farm.depth / farm.rowCount;
          const world = new THREE.Vector3(0, 0, localZ)
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), farm.yaw);
          position.set(farm.x + world.x, farm.y + 0.2, farm.z + world.z);
          scale.set(farm.width * 0.94, 1, 0.055);
          matrix.compose(position, quaternion, scale);
          rows.setMatrixAt(rowIndex, matrix);
          rowIndex += 1;

          for (let column = 0; column < farm.perRow; column += 1) {
            const localX = -farm.width * 0.5 + (column + 0.5) * farm.width / farm.perRow;
            const cropWorld = new THREE.Vector3(
              localX + (rng() - 0.5) * 0.1,
              0,
              localZ + (rng() - 0.5) * 0.08
            ).applyAxisAngle(new THREE.Vector3(0, 1, 0), farm.yaw);
            position.set(
              farm.x + cropWorld.x,
              farm.y + 0.45,
              farm.z + cropWorld.z
            );
            scale.set(
              randRange(rng, 0.72, 1.12),
              randRange(rng, 0.8, 1.3),
              randRange(rng, 0.72, 1.12)
            );
            matrix.compose(position, quaternion, scale);
            crops.setMatrixAt(cropIndex, matrix);
            color.setHSL(
              randRange(rng, 0.18, 0.25),
              randRange(rng, 0.42, 0.62),
              randRange(rng, 0.34, 0.5)
            );
            crops.setColorAt(cropIndex, color);
            cropIndex += 1;
          }
        }
      });

      [soil, rows, crops].forEach((mesh) => {
        mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
        mesh.instanceMatrix.needsUpdate = true;
        mesh.receiveShadow = true;
        mesh.computeBoundingSphere();
      });
      if (crops.instanceColor) {
        crops.instanceColor.needsUpdate = true;
      }
      soil.castShadow = true;
      crops.castShadow = true;
      group.add(soil, rows, crops);
      return group;
    }

    function nearestHouse(x, z, houses) {
      let best = null;
      for (const house of houses) {
        const distance = Math.hypot(x - house.x, z - house.z);
        if (!best || distance < best.distance) {
          best = { house, distance };
        }
      }
      return best;
    }

    function placeFarms(config, plan, houses, materials, rng, heightAt, reservedZones) {
      const farms = [];
      let attempts = 0;

      while (farms.length < config.farmCountTarget && attempts < WORLD.maxPlacementAttempts) {
        attempts += 1;
        const anchorType = choice(rng, ["road", "water", "house"]);
        let center;
        let reason = "";
        let nearDistance = 0;

        if (anchorType === "road") {
          const nearRoad = sampleNearRoad(rng, plan);
          center = {
            x: nearRoad.x + randRange(rng, -3.5, 3.5),
            z: nearRoad.z + randRange(rng, -3.5, 3.5)
          };
          const nearest = nearestRoad(center.x, center.z, plan);
          nearDistance = nearest?.distance ?? Infinity;
          reason = `近路 ${nearDistance.toFixed(1)}m`;
        } else if (anchorType === "water") {
          const x = randRange(rng, -WORLD.halfW + 10, WORLD.halfW - 10);
          const side = rng() > 0.5 ? 1 : -1;
          const z = plan.riverZ + side * randRange(rng, plan.riverWidth * 0.5 + 4.5, plan.riverWidth * 0.5 + 15);
          center = { x, z };
          nearDistance = Math.abs(z - plan.riverZ);
          reason = `近水 ${nearDistance.toFixed(1)}m`;
        } else {
          if (houses.length === 0) {
            continue;
          }
          const house = choice(rng, houses);
          const angle = rng() * Math.PI * 2;
          const distance = randRange(rng, house.radius + 5.5, house.radius + 11.5);
          center = {
            x: house.x + Math.cos(angle) * distance,
            z: house.z + Math.sin(angle) * distance
          };
          nearDistance = distance;
          reason = `近宅 ${nearDistance.toFixed(1)}m`;
        }

        const width = randRange(rng, 5.4, 10.5);
        const depth = randRange(rng, 4.2, 8.3);
        const radius = Math.hypot(width, depth) * 0.5;
        if (!isInsideWorld(center.x, center.z, radius + 4)) {
          continue;
        }
        if (!isZoneClear(center.x, center.z, radius + 0.7, reservedZones)) {
          continue;
        }

        const roadDistance = nearestRoad(center.x, center.z, plan)?.distance ?? Infinity;
        const waterDistance = Math.abs(center.z - plan.riverZ);
        const houseDistance = nearestHouse(center.x, center.z, houses)?.distance ?? Infinity;
        const satisfiesRule =
          roadDistance <= 18 ||
          waterDistance <= plan.riverWidth * 0.5 + 17 ||
          houseDistance <= 22;
        if (!satisfiesRule || terrainSlope(heightAt, center.x, center.z) > 2.25 * config.terrainRelief) {
          continue;
        }

        farms.push({
          object: null,
          x: center.x,
          z: center.z,
          y: heightAt(center.x, center.z) + 0.03,
          width,
          depth,
          radius,
          yaw: rng() > 0.5 ? Math.PI * 0.5 : 0,
          reason,
          roadDistance,
          waterDistance,
          houseDistance
        });
        reservedZones.push({
          x: center.x,
          z: center.z,
          r: radius + 0.4,
          type: "farm"
        });
      }

      // 农田保底：若随机采样不足，沿道路两侧以固定间距补足，
      // 仍满足“近路、近水或近宅”至少一项。
      const fallbackTarget = Math.min(config.farmCountTarget, 4);
      if (farms.length < fallbackTarget) {
        for (const segment of plan.allRoadSegments) {
          if (farms.length >= fallbackTarget || attempts >= WORLD.maxPlacementAttempts) {
            break;
          }
          const alongX = segment.axis === "x";
          const length = Math.hypot(
            segment.x2 - segment.x1,
            segment.z2 - segment.z1
          );
          const steps = Math.max(3, Math.floor(length / 11));
          for (let step = 0; step < steps; step += 1) {
            for (const side of [-1, 1]) {
              for (const offset of [7.5, 12.5]) {
                if (farms.length >= fallbackTarget || attempts >= WORLD.maxPlacementAttempts) {
                  break;
                }
                attempts += 1;
                const t = (step + 0.5) / steps;
                const anchorX = lerp(segment.x1, segment.x2, t);
                const anchorZ = lerp(segment.z1, segment.z2, t);
                const center = alongX
                  ? { x: anchorX, z: anchorZ + side * offset }
                  : { x: anchorX + side * offset, z: anchorZ };
                const width = randRange(rng, 4.8, 7.6);
                const depth = randRange(rng, 3.8, 6.2);
                const radius = Math.hypot(width, depth) * 0.5;
                if (!isInsideWorld(center.x, center.z, radius + 3)) {
                  continue;
                }
                if (!isZoneClear(center.x, center.z, radius + 0.55, reservedZones)) {
                  continue;
                }
                const roadDistance = nearestRoad(center.x, center.z, plan)?.distance ?? Infinity;
                const waterDistance = Math.abs(center.z - plan.riverZ);
                const houseDistance = nearestHouse(center.x, center.z, houses)?.distance ?? Infinity;
                if (
                  roadDistance > 19 &&
                  waterDistance > plan.riverWidth * 0.5 + 18 &&
                  houseDistance > 23
                ) {
                  continue;
                }
                farms.push({
                  object: null,
                  x: center.x,
                  z: center.z,
                  y: heightAt(center.x, center.z) + 0.03,
                  width,
                  depth,
                  radius,
                  yaw: alongX ? 0 : Math.PI * 0.5,
                  reason: `保底近路 ${roadDistance.toFixed(1)}m`,
                  roadDistance,
                  waterDistance,
                  houseDistance
                });
                reservedZones.push({
                  x: center.x,
                  z: center.z,
                  r: radius + 0.4,
                  type: "farm"
                });
              }
            }
          }
        }
      }

      const farmBatch = buildInstancedFarmBatches(farms, materials, rng);
      worldRoot.add(farmBatch);
      farms.forEach((farm) => {
        farm.object = farmBatch;
      });

      return farms;
    }

    function findPagodaSite(plan, config, rng, heightAt, zones) {
      let best = null;
      let bestScore = -Infinity;

      for (let i = 0; i < WORLD.maxPlacementAttempts; i += 1) {
        const x = randRange(rng, -WORLD.halfW + 12, WORLD.halfW - 12);
        const z = randRange(rng, -WORLD.halfD + 11, WORLD.halfD - 11);
        if (!isZoneClear(x, z, 6.2, zones)) {
          continue;
        }
        const road = nearestRoad(x, z, plan);
        if (!road || road.distance < 6.8) {
          continue;
        }
        const riverDistance = Math.abs(z - plan.riverZ);
        if (riverDistance < plan.riverWidth * 0.5 + 5.5) {
          continue;
        }

        const tulouDistance = Math.hypot(x - config.tulouX, z - config.tulouZ);
        const eastBias = (x + WORLD.halfW) / WORLD.width;
        const ridgeBias = clamp((-z + WORLD.halfD) / WORLD.depth, 0, 1);
        const score =
          Math.min(tulouDistance, 52) * 0.7 +
          eastBias * 18 +
          ridgeBias * 12 +
          rng() * 8;
        if (score > bestScore) {
          bestScore = score;
          best = { x, z, score };
        }
      }

      return best;
    }

    function createPagodaZone(plan, config, materials, rng, heightAt, zones) {
      const site = findPagodaSite(plan, config, rng, heightAt, zones) ?? {
        x: WORLD.halfW - 18,
        z: -WORLD.halfD + 18,
        score: 0
      };

      const pagoda = createPagoda(config, materials, rng, heightAt);
      pagoda.position.set(site.x, heightAt(site.x, site.z) + 0.03, site.z);
      pagoda.rotation.y = rng() * Math.PI * 2;
      worldRoot.add(pagoda);

      zones.push({
        x: site.x,
        z: site.z,
        r: 16 * WORLD.cell,
        type: "pagoda-clear"
      });

      return {
        object: pagoda,
        x: site.x,
        z: site.z,
        requiredDistance: 16 * WORLD.cell,
        external: Boolean(pagoda.userData.isExternal),
        height: pagoda.userData.height ?? 11
      };
    }

    function createTree(materials, rng, seedValue) {
      const local = mulberry32(seedValue);
      const kindRoll = local();
      const group = new THREE.Group();
      group.name = "tree";

      if (kindRoll < 0.42) {
        const trunk = new THREE.Mesh(
          cachedGeometry("tree-trunk", () => new THREE.CylinderGeometry(0.18, 0.29, 2.5, 7)),
          materials.trunk
        );
        trunk.position.y = 1.25;
        trunk.castShadow = true;
        group.add(trunk);

        const crownGeometry = cachedGeometry(
          "broadleaf-crown",
          () => new THREE.DodecahedronGeometry(1.25, 1)
        );
        const crownCount = randInt(local, 3, 5);
        for (let i = 0; i < crownCount; i += 1) {
          const crown = new THREE.Mesh(crownGeometry, i % 2 === 0 ? materials.leafA : materials.leafB);
          const angle = i / crownCount * Math.PI * 2;
          crown.position.set(
            Math.cos(angle) * randRange(local, 0.35, 0.85),
            2.75 + randRange(local, -0.35, 0.75),
            Math.sin(angle) * randRange(local, 0.35, 0.85)
          );
          crown.scale.set(
            randRange(local, 0.68, 1.18),
            randRange(local, 0.65, 1.25),
            randRange(local, 0.68, 1.18)
          );
          crown.castShadow = true;
          group.add(crown);
        }
      } else if (kindRoll < 0.72) {
        const trunk = new THREE.Mesh(
          cachedGeometry("tree-trunk", () => new THREE.CylinderGeometry(0.18, 0.29, 2.5, 7)),
          materials.trunk
        );
        trunk.position.y = 1.25;
        trunk.castShadow = true;
        group.add(trunk);

        const pineGeometry = cachedGeometry(
          "pine-crown",
          () => new THREE.ConeGeometry(1.28, 2.15, 8)
        );
        for (let i = 0; i < 3; i += 1) {
          const crown = new THREE.Mesh(pineGeometry, materials.leafA);
          crown.position.y = 2.15 + i * 1.05;
          crown.scale.setScalar(1 - i * 0.18);
          crown.castShadow = true;
          group.add(crown);
        }
      } else {
        const trunkGeometry = cachedGeometry(
          "bamboo-stalk",
          () => new THREE.CylinderGeometry(0.07, 0.1, 4.6, 6)
        );
        const leafGeometry = cachedGeometry(
          "bamboo-leaf",
          () => new THREE.OctahedronGeometry(0.62, 0)
        );
        const stalkCount = randInt(local, 4, 7);
        for (let i = 0; i < stalkCount; i += 1) {
          const stalk = new THREE.Mesh(trunkGeometry, materials.bamboo);
          stalk.position.set(
            randRange(local, -0.55, 0.55),
            2.3,
            randRange(local, -0.55, 0.55)
          );
          stalk.rotation.z = randRange(local, -0.08, 0.08);
          stalk.castShadow = true;
          group.add(stalk);

          const leaves = new THREE.Mesh(leafGeometry, materials.leafB);
          leaves.position.set(stalk.position.x, 4.25, stalk.position.z);
          leaves.scale.set(0.7, 0.38, 0.7);
          leaves.castShadow = true;
          group.add(leaves);
        }
      }

      return group;
    }

    function buildInstancedTreeBatches(placements, materials, heightAt) {
      const group = new THREE.Group();
      group.name = "instanced-trees";
      const batches = new Map();
      const addInstance = (key, geometryFactory, material, matrix, castShadow = true) => {
        if (!batches.has(key)) {
          batches.set(key, {
            geometry: geometryFactory(),
            material,
            matrices: [],
            castShadow
          });
        }
        batches.get(key).matrices.push(matrix);
      };

      const rootPosition = new THREE.Vector3();
      const rootQuaternion = new THREE.Quaternion();
      const rootScale = new THREE.Vector3();
      const localPosition = new THREE.Vector3();
      const localQuaternion = new THREE.Quaternion();
      const localScale = new THREE.Vector3();
      const rootMatrix = new THREE.Matrix4();
      const localMatrix = new THREE.Matrix4();
      const worldMatrix = new THREE.Matrix4();

      placements.forEach((placement) => {
        const groundY = heightAt(placement.x, placement.z) + 0.02;
        rootPosition.set(placement.x, groundY, placement.z);
        rootQuaternion.setFromEuler(new THREE.Euler(0, placement.rotation, 0));
        rootScale.setScalar(placement.scale);
        rootMatrix.compose(rootPosition, rootQuaternion, rootScale);

        const addLocal = (key, geometryFactory, material, position, scale, rotation = [0, 0, 0], castShadow = true) => {
          localPosition.fromArray(position);
          localQuaternion.setFromEuler(new THREE.Euler().fromArray(rotation));
          localScale.fromArray(scale);
          localMatrix.compose(localPosition, localQuaternion, localScale);
          worldMatrix.multiplyMatrices(rootMatrix, localMatrix);
          addInstance(key, geometryFactory, material, worldMatrix.clone(), castShadow);
        };

        if (placement.kind === "conifer") {
          addLocal(
            "tree-conifer-trunk",
            () => new THREE.CylinderGeometry(0.16, 0.26, 2.4, 7),
            materials.trunk,
            [0, 1.2, 0],
            [1, 1, 1]
          );
          addLocal(
            "tree-conifer-crown-a",
            () => new THREE.ConeGeometry(1.34, 2.25, 8),
            materials.leafA,
            [0, 2.55, 0],
            [1, 1, 1]
          );
          addLocal(
            "tree-conifer-crown-b",
            () => new THREE.ConeGeometry(1.12, 1.88, 8),
            materials.leafB,
            [0, 3.56, 0],
            [1, 1, 1]
          );
          addLocal(
            "tree-conifer-crown-c",
            () => new THREE.ConeGeometry(0.88, 1.5, 8),
            materials.leafA,
            [0, 4.42, 0],
            [1, 1, 1]
          );
        } else if (placement.kind === "bamboo") {
          const stalkCount = 4 + (placement.seed % 4);
          for (let i = 0; i < stalkCount; i += 1) {
            const angle = i / stalkCount * Math.PI * 2 + placement.rotation;
            const radial = 0.22 + (i % 2) * 0.24;
            addLocal(
              "tree-bamboo-stalk",
              () => new THREE.CylinderGeometry(0.065, 0.09, 4.6, 6),
              materials.bamboo,
              [Math.cos(angle) * radial, 2.3, Math.sin(angle) * radial],
              [1, randRange(mulberry32(placement.seed + i), 0.86, 1.12), 1],
              [0, 0, randRange(mulberry32(placement.seed + i * 11), -0.07, 0.07)],
              i % 2 === 0
            );
            addLocal(
              "tree-bamboo-leaf",
              () => new THREE.OctahedronGeometry(0.68, 0),
              materials.leafB,
              [Math.cos(angle) * radial, 4.28, Math.sin(angle) * radial],
              [0.82, 0.34, 0.82],
              [0, angle, 0],
              false
            );
          }
        } else {
          addLocal(
            "tree-broadleaf-trunk",
            () => new THREE.CylinderGeometry(0.2, 0.32, 2.6, 7),
            materials.trunk,
            [0, 1.3, 0],
            [1, 1, 1]
          );
          const crownCount = 3 + (placement.seed % 3);
          for (let i = 0; i < crownCount; i += 1) {
            const angle = i / crownCount * Math.PI * 2 + placement.rotation;
            addLocal(
              i % 2 === 0 ? "tree-broadleaf-crown-a" : "tree-broadleaf-crown-b",
              () => new THREE.DodecahedronGeometry(1.22, 1),
              i % 2 === 0 ? materials.leafA : materials.leafB,
              [
                Math.cos(angle) * 0.72,
                2.95 + Math.sin(i * 1.7) * 0.35,
                Math.sin(angle) * 0.72
              ],
              [1, 0.92 + (i % 2) * 0.16, 1],
              [0, angle, 0]
            );
          }
        }
      });

      batches.forEach((batch, key) => {
        const mesh = new THREE.InstancedMesh(
          batch.geometry,
          batch.material,
          batch.matrices.length
        );
        batch.matrices.forEach((matrix, index) => mesh.setMatrixAt(index, matrix));
        mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = batch.castShadow;
        mesh.receiveShadow = true;
        mesh.name = `tree-batch-${key}`;
        mesh.computeBoundingSphere();
        group.add(mesh);
      });

      return group;
    }

    function createTreeClusters(rng, plan) {
      const clusters = [];
      const count = randInt(rng, 7, 11);
      for (let i = 0; i < count; i += 1) {
        if (rng() > 0.55) {
          clusters.push({
            x: randRange(rng, -WORLD.halfW + 6, WORLD.halfW - 6),
            z: rng() > 0.5
              ? randRange(rng, plan.riverZ + plan.riverWidth * 0.65, plan.riverZ + plan.riverWidth * 0.65 + 13)
              : randRange(rng, -WORLD.halfD + 5, -WORLD.halfD + 29),
            radius: randRange(rng, 7, 15)
          });
        } else {
          clusters.push({
            x: rng() > 0.5
              ? randRange(rng, -WORLD.halfW + 5, -WORLD.halfW + 24)
              : randRange(rng, WORLD.halfW - 24, WORLD.halfW - 5),
            z: randRange(rng, -WORLD.halfD + 8, WORLD.halfD - 8),
            radius: randRange(rng, 7, 14)
          });
        }
      }
      return clusters;
    }

    function pointInAnyZone(x, z, radius, zones, allowedTypes = []) {
      return zones.some((zone) => {
        if (allowedTypes.includes(zone.type)) {
          return false;
        }
        return Math.hypot(x - zone.x, z - zone.z) < zone.r + radius;
      });
    }

    function createVegetation(config, plan, materials, rng, heightAt, zones, tulouArea) {
      const clusterCenters = createTreeClusters(rng, plan);
      const placements = [];
      let attempts = 0;

      function testPlacement(x, z, mode) {
        if (!isInsideWorld(x, z, 3.2)) {
          return false;
        }
        const roadDistance = nearestRoad(x, z, plan)?.distance ?? Infinity;
        if (roadDistance < 3.6) {
          return false;
        }
        const riverDistance = Math.abs(z - plan.riverZ);
        if (riverDistance < plan.riverWidth * 0.5 + 1.8) {
          return false;
        }
        if (pointInAnyZone(x, z, 1.3, zones)) {
          return false;
        }
        placements.push({
          x,
          z,
          mode,
          scale: randRange(rng, mode === "forest" ? 0.86 : 0.65, mode === "forest" ? 1.38 : 1.18),
          rotation: rng() * Math.PI * 2,
          seed: Math.floor(rng() * 0xffffffff),
          kind: rng() < 0.5 ? "broadleaf" : (rng() < 0.62 ? "conifer" : "bamboo")
        });
        return true;
      }

      const randomAttemptLimit = Math.min(3600, WORLD.maxPlacementAttempts);
      while (placements.length < config.treeCountTarget && attempts < randomAttemptLimit) {
        attempts += 1;
        const modeRoll = rng();
        let x;
        let z;
        let mode;

        if (modeRoll < 0.26) {
          mode = "bank";
          x = randRange(rng, -WORLD.halfW + 5, WORLD.halfW - 5);
          const side = rng() > 0.5 ? 1 : -1;
          z = plan.riverZ + side * randRange(rng, plan.riverWidth * 0.5 + 2.2, plan.riverWidth * 0.5 + 12);
        } else if (modeRoll < 0.53) {
          mode = "edge";
          if (rng() > 0.5) {
            x = rng() > 0.5
              ? randRange(rng, -WORLD.halfW + 3.5, -WORLD.halfW + 18)
              : randRange(rng, WORLD.halfW - 18, WORLD.halfW - 3.5);
            z = randRange(rng, -WORLD.halfD + 4, WORLD.halfD - 4);
          } else {
            x = randRange(rng, -WORLD.halfW + 4, WORLD.halfW - 4);
            z = rng() > 0.5
              ? randRange(rng, -WORLD.halfD + 3.5, -WORLD.halfD + 17)
              : randRange(rng, WORLD.halfD - 17, WORLD.halfD - 3.5);
          }
        } else {
          mode = "cluster";
          const cluster = choice(rng, clusterCenters);
          const angle = rng() * Math.PI * 2;
          const radius = Math.sqrt(rng()) * cluster.radius;
          x = cluster.x + Math.cos(angle) * radius;
          z = cluster.z + Math.sin(angle) * radius;
        }

        if (rng() < (mode === "cluster" ? 0.94 : 0.78)) {
          testPlacement(x, z, mode);
        }
      }

      // 植被保底：为验证规则要求的三种分布各保留最低数量。
      const minimumModeCounts = { bank: 8, edge: 12, cluster: 14 };
      const modeCount = (mode) => placements.reduce(
        (count, placement) => count + (placement.mode === mode ? 1 : 0),
        0
      );
      const fillVegetationMode = (mode, factory) => {
        let guard = 0;
        while (
          modeCount(mode) < minimumModeCounts[mode] &&
          attempts < WORLD.maxPlacementAttempts &&
          guard < 900
        ) {
          guard += 1;
          attempts += 1;
          const candidate = factory();
          testPlacement(candidate.x, candidate.z, mode);
        }
      };

      fillVegetationMode("bank", () => ({
        x: randRange(rng, -WORLD.halfW + 5, WORLD.halfW - 5),
        z: plan.riverZ + (rng() > 0.5 ? 1 : -1) *
          randRange(rng, plan.riverWidth * 0.5 + 2.2, plan.riverWidth * 0.5 + 11)
      }));
      fillVegetationMode("edge", () => {
        if (rng() > 0.5) {
          return {
            x: rng() > 0.5
              ? randRange(rng, -WORLD.halfW + 3.5, -WORLD.halfW + 17)
              : randRange(rng, WORLD.halfW - 17, WORLD.halfW - 3.5),
            z: randRange(rng, -WORLD.halfD + 4, WORLD.halfD - 4)
          };
        }
        return {
          x: randRange(rng, -WORLD.halfW + 4, WORLD.halfW - 4),
          z: rng() > 0.5
            ? randRange(rng, -WORLD.halfD + 3.5, -WORLD.halfD + 16)
            : randRange(rng, WORLD.halfD - 16, WORLD.halfD - 3.5)
        };
      });
      fillVegetationMode("cluster", () => {
        const cluster = choice(rng, clusterCenters);
        const angle = rng() * Math.PI * 2;
        const radius = Math.sqrt(rng()) * cluster.radius;
        return {
          x: cluster.x + Math.cos(angle) * radius,
          z: cluster.z + Math.sin(angle) * radius
        };
      });

      const fengshuiCount = randInt(rng, 22, 34);
      let forestPlaced = 0;
      let forestAttempts = 0;
      while (forestPlaced < fengshuiCount && forestAttempts < 900) {
        forestAttempts += 1;
        const theta = Math.PI + rng() * Math.PI;
        const radius = randRange(rng, config.radius * 0.42, config.radius + 10.5);
        const x = tulouArea.forestCenter.x + Math.cos(theta) * radius;
        const z = tulouArea.forestCenter.z - Math.sin(theta) * radius * 0.45;
        if (testPlacement(x, z, "forest")) {
          forestPlaced += 1;
        }
      }

      const treeBatch = buildInstancedTreeBatches(placements, materials, heightAt);
      worldRoot.add(treeBatch);
      const trees = placements.map((placement) => ({
        object: treeBatch,
        x: placement.x,
        z: placement.z,
        mode: placement.mode,
        kind: placement.kind
      }));

      return { trees, clusterCenters };
    }

    function placePaifangs(plan, config, materials, rng, heightAt) {
      const paifangs = [];
      const endPositions = [
        { x: plan.mainRoadX, z: -WORLD.halfD + 2.3, label: "北端" },
        { x: plan.mainRoadX, z: WORLD.halfD - 2.3, label: "南端" }
      ];

      endPositions.forEach((position) => {
        const included = rng() < 0.85;
        if (!included) {
          paifangs.push({
            ...position,
            included: false,
            object: null
          });
          return;
        }

        const paifang = createPaifang(materials, rng, config);
        paifang.position.set(position.x, heightAt(position.x, position.z) + 0.02, position.z);
        paifang.rotation.y = 0;
        worldRoot.add(paifang);
        paifangs.push({
          ...position,
          included: true,
          object: paifang
        });
      });

      return paifangs;
    }

    function validateMap(data) {
      const checks = [];
      const roads = [...data.plan.roads, data.plan.bridgeRoad];
      const roadRiverOrthogonal = roads.every(axisAligned) &&
        data.plan.crossings.every(({ river, road }) => {
          const riverHorizontal = Math.abs(river.x2 - river.x1) > Math.abs(river.z - river.z);
          const roadVertical = Math.abs(road.z2 - road.z1) > Math.abs(road.x2 - road.x1);
          return riverHorizontal && roadVertical;
        });
      checks.push({ label: "河路正交", pass: roadRiverOrthogonal });

      const waterfrontStraight = roads
        .filter((road) => road.kind === "waterfront" || nearestPointOnSegment(
          road.x1,
          road.z1,
          data.plan.river
        ).distance < 28)
        .every(axisAligned);
      checks.push({ label: "近水锁直", pass: waterfrontStraight });

      let houseSeparation = true;
      for (let i = 0; i < data.houses.length; i += 1) {
        for (let j = i + 1; j < data.houses.length; j += 1) {
          const a = data.houses[i];
          const b = data.houses[j];
          if (Math.hypot(a.x - b.x, a.z - b.z) < a.radius + b.radius + WORLD.cell - 0.001) {
            houseSeparation = false;
          }
        }
      }
      checks.push({ label: "房屋隔离", pass: houseSeparation && data.houses.length > 0 });

      const doorsFaceRoads = data.houses.every((house) => {
        const nearest = nearestRoad(house.x, house.z, data.plan);
        if (!nearest) {
          return false;
        }
        const doorX = Math.sin(house.yaw);
        const doorZ = Math.cos(house.yaw);
        const toRoadLength = Math.max(nearest.distance, 0.001);
        const toRoadX = (nearest.x - house.x) / toRoadLength;
        const toRoadZ = (nearest.z - house.z) / toRoadLength;
        return doorX * toRoadX + doorZ * toRoadZ > 0.94;
      });
      checks.push({ label: "门朝道路", pass: doorsFaceRoads });

      const farmsNearAnchor = data.farms.length > 0 && data.farms.every((farm) =>
        farm.roadDistance <= 18 ||
        farm.waterDistance <= data.plan.riverWidth * 0.5 + 17 ||
        farm.houseDistance <= 22
      );
      checks.push({ label: "农田近宅路水", pass: farmsNearAnchor });

      const pagodaDistance = data.houses.every((house) =>
        Math.hypot(house.x - data.pagoda.x, house.z - data.pagoda.z) >= data.pagoda.requiredDistance - 0.001
      );
      checks.push({ label: "宝塔十六格", pass: pagodaDistance });

      const paifangProbability = data.paifangs.length === 2 &&
        data.paifangs.every((item) => typeof item.included === "boolean");
      checks.push({ label: "牌坊八五概率", pass: paifangProbability });

      const vegetationCounts = data.vegetation.trees.reduce(
        (counts, tree) => {
          counts[tree.mode] = (counts[tree.mode] ?? 0) + 1;
          return counts;
        },
        {}
      );
      const vegetationDensity =
        (vegetationCounts.bank ?? 0) >= 4 &&
        (vegetationCounts.edge ?? 0) >= 7 &&
        (vegetationCounts.cluster ?? 0) >= 6 &&
        (vegetationCounts.forest ?? 0) >= 12;
      checks.push({ label: "植被加密", pass: vegetationDensity });

      return {
        checks,
        allPass: checks.every((check) => check.pass),
        passed: checks.filter((check) => check.pass).length
      };
    }

    function createSky() {
      if (state.skyMaterial) {
        state.skyMaterial.uniforms.topColor.value.set(0x5f7e93);
        state.skyMaterial.uniforms.horizonColor.value.set(0xd8d7b8);
        return;
      }

      const skyMaterial = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x58798f) },
          horizonColor: { value: new THREE.Color(0xd8d7b8) },
          groundColor: { value: new THREE.Color(0x687057) }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          uniform vec3 groundColor;
          varying vec3 vWorldPosition;
          void main() {
            float h = normalize(vWorldPosition).y;
            vec3 sky = mix(horizonColor, topColor, smoothstep(-0.02, 0.72, h));
            sky = mix(groundColor, sky, smoothstep(-0.34, 0.06, h));
            gl_FragColor = vec4(sky, 1.0);
          }
        `
      });

      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(280, 36, 18),
        skyMaterial
      );
      sky.name = "sky-dome";
      scene.add(sky);
      state.skyMaterial = skyMaterial;
    }

    function setSkyColors(config, rng) {
      if (!state.skyMaterial) {
        return;
      }
      const skyTone = choice(rng, [0x58798f, 0x60869a, 0x6c8792, 0x55758b]);
      const horizonTone = choice(rng, [0xd8d7b8, 0xd7cfaa, 0xc9d1bd, 0xe0cda9]);
      state.skyMaterial.uniforms.topColor.value.setHex(skyTone);
      state.skyMaterial.uniforms.horizonColor.value.setHex(horizonTone);
      state.skyMaterial.uniforms.groundColor.value.setHex(0x687057);
      scene.fog.color.setHex(horizonTone);
      renderer.setClearColor(horizonTone, 1);
    }

    function disposeGeneratedGroup(group) {
      const materials = new Set();
      const textures = new Set([
        ...state.generatedTextures,
        ...state.waterTextures
      ]);

      group.traverse((object) => {
        if (object.userData.externalModel) {
          return;
        }
        if (object.geometry && !object.geometry.userData.shared) {
          object.geometry.dispose();
        }
        if (object.material) {
          const objectMaterials = Array.isArray(object.material)
            ? object.material
            : [object.material];
          objectMaterials.forEach((material) => materials.add(material));
        }
      });

      materials.forEach((material) => {
        if (material.userData.shared) {
          return;
        }
        Object.values(material).forEach((value) => {
          if (value && value.isTexture) {
            textures.add(value);
          }
        });
        if (material.uniforms) {
          Object.values(material.uniforms).forEach((uniform) => {
            if (uniform?.value?.isTexture) {
              textures.add(uniform.value);
            }
          });
        }
        material.dispose();
      });

      textures.forEach((texture) => {
        if (!texture.userData.shared) {
          texture.dispose();
        }
      });
      state.generatedTextures = [];
      state.waterTextures = [];
    }

    function disposeGeneratedTextures() {
      const textures = new Set([
        ...state.generatedTextures,
        ...state.waterTextures
      ]);
      textures.forEach((texture) => texture.dispose());
      state.generatedTextures = [];
      state.waterTextures = [];
    }

    async function initializePostProcessing() {
      if (postProcessingRequested || postProcessingReady) {
        return;
      }
      postProcessingRequested = true;

      try {
        const importWithTimeout = (path, timeout = 6000) => withTimeout(
          import(path),
          timeout,
          `后处理模块加载超时：${path}`
        );
        const [
          { EffectComposer },
          { RenderPass },
          { UnrealBloomPass },
          { OutputPass },
          { SMAAPass },
          { RoomEnvironment }
        ] = await Promise.all([
          importWithTimeout("three/addons/postprocessing/EffectComposer.js"),
          importWithTimeout("three/addons/postprocessing/RenderPass.js"),
          importWithTimeout("three/addons/postprocessing/UnrealBloomPass.js"),
          importWithTimeout("three/addons/postprocessing/OutputPass.js"),
          importWithTimeout("three/addons/postprocessing/SMAAPass.js"),
          importWithTimeout("three/addons/environments/RoomEnvironment.js")
        ]);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const environmentScene = new RoomEnvironment();
        const environmentTarget = pmremGenerator.fromScene(environmentScene, 0.04);
        scene.environment = environmentTarget.texture;
        environmentScene.dispose();
        pmremGenerator.dispose();

        composer = new EffectComposer(renderer);
        composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        composer.setSize(window.innerWidth, window.innerHeight);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.2,
          0.34,
          0.9
        ));
        composer.addPass(new SMAAPass(window.innerWidth, window.innerHeight));
        composer.addPass(new OutputPass());
        postProcessingReady = true;
        onResize();
      } catch (error) {
        composer = null;
        console.warn("后处理增强不可用，核心场景继续使用 WebGLRenderer 渲染。", error);
      } finally {
        postProcessingRequested = false;
      }
    }

    function updateChecks(result) {
      ui.checks.innerHTML = "";
      result.checks.forEach((check) => {
        const row = document.createElement("div");
        row.className = `check${check.pass ? "" : " fail"}`;
        const dot = document.createElement("i");
        dot.className = "check-dot";
        const label = document.createElement("span");
        label.textContent = check.label;
        row.append(dot, label);
        ui.checks.appendChild(row);
      });

      ui.ruleSummary.textContent = result.allPass
        ? `规则校验 ${result.passed}/${result.checks.length}`
        : `规则异常 ${result.passed}/${result.checks.length}`;
      ui.ruleSummary.style.color = result.allPass ? "var(--accent-2)" : "var(--danger)";
    }

    function updateStats(data) {
      ui.seed.textContent = `seed ${data.seed.toString(16).padStart(8, "0")}`;
      ui.statRings.textContent = `${["一围", "二围", "三围"][data.config.ringCount - 1]} / 横屋 ${data.config.wingCount}`;
      ui.statMaterial.textContent = `${data.config.wallType} / 天井 ${data.config.courtyardCount}`;
      ui.statPond.textContent = data.config.pondShape;
      ui.statDecoration.textContent = `${Math.round(data.config.decorationDensity * 100)}%`;
      ui.statBuildings.textContent = `${data.houses.length} 宅 / ${data.farms.length} 田`;
      ui.statPagoda.textContent = `${data.config.pagodaSides}角 / ${data.config.pagodaFloors}层`;
    }

    async function loadExternalModels() {
      if (state.externalLoadPromise) {
        return state.externalLoadPromise;
      }
      if (state.modelsLoaded) {
        return state.models;
      }

      state.loadingModels = true;
      state.modelErrors = [];
      updateModelUi();
      ui.protocolNote.textContent = location.protocol === "file:"
        ? "正在尝试读取本地 GLB；file:// 被浏览器拦截时会自动使用程序化模型"
        : "正在并行检测本地 GLB 模型";

      state.externalLoadPromise = (async () => {
        const entries = Object.entries(ASSET_MANIFEST);
        const loadEntry = async ([key, config]) => {
          try {
            const gltf = await withTimeout(
              gltfLoader.loadAsync(config.path),
              config.timeout ?? 4500,
              `GLB 加载超时：${config.path}`
            );
            gltf.scene.name = `external-${key}`;
            gltf.scene.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.material) {
                  const materials = Array.isArray(child.material) ? child.material : [child.material];
                  materials.forEach((material) => {
                    material.side = THREE.FrontSide;
                    material.needsUpdate = true;
                  });
                }
              }
            });
            state.models.set(key, gltf.scene);
          } catch (error) {
            state.modelErrors.push({
              key,
              message: error?.message ?? "unknown error"
            });
          }
        };

        // 先单独探测整体模型；命中后不再请求其它拆分模型，避免重复显示。
        const preferredEntry = entries.find(([key]) => key === "village");
        if (preferredEntry) {
          await loadEntry(preferredEntry);
        }

        // 缺少整体 GLB 时，再并行探测各个拆分模型。并行可避免多个 404
        // 依次等待，把首屏之外的模型刷新延迟累加到几十秒。
        if (!state.models.has("village")) {
          await Promise.all(
            entries
              .filter(([key]) => key !== "village")
              .map(loadEntry)
          );
        }

        state.modelsLoaded = true;
        state.loadingModels = false;
        updateModelUi();
        return state.models;
      })().finally(() => {
        state.externalLoadPromise = null;
      });

      return state.externalLoadPromise;
    }

    function updateModelUi() {
      const loaded = state.models.size;
      const enabled = ui.useGLB.checked;
      if (!enabled) {
        ui.modelStatus.textContent = "程序化模型模式";
        ui.fallbackNotice.hidden = false;
        ui.fallbackNotice.textContent = "当前为纯代码预览模式，加载本地 GLB 可获极致画质";
        return;
      }
      if (state.loadingModels) {
        ui.modelStatus.textContent = "正在读取本地 GLB...";
        ui.fallbackNotice.hidden = true;
        return;
      }
      if (loaded > 0) {
        ui.modelStatus.textContent = state.models.has("village")
          ? "已载入整体围龙屋 GLB"
          : `已载入 ${loaded} 个 GLB`;
        ui.fallbackNotice.hidden = true;
      } else {
        ui.modelStatus.textContent = "纯代码预览模式";
        ui.fallbackNotice.hidden = false;
        ui.fallbackNotice.textContent = "当前为纯代码预览模式，加载本地 GLB 可获极致画质";
      }
    }

    async function generateMap() {
      if (state.isGenerating) {
        return;
      }
      state.isGenerating = true;
      ui.generate.disabled = true;
      ui.loading.classList.remove("hidden");
      await nextFrame();
      await yieldToBrowser();

      try {
        state.seed = makeSeed();
        state.rng = mulberry32(state.seed);
        const rng = state.rng;
        const config = createConfig(rng);
        const plan = createRoadPlan(rng, config);
        const terrainSystem = createTerrainSystem(config, plan);
        const { heightAt, waterY } = terrainSystem;

        disposeGeneratedGroup(worldRoot);
        while (worldRoot.children.length) {
          worldRoot.remove(worldRoot.children[0]);
        }
        state.waterMaterials = [];
        const materials = createMaterialSet(config, rng);

        setSkyColors(config, rng);

        const reservedZones = [
          {
            x: config.tulouX,
            z: config.tulouZ,
            r: config.radius + WORLD.cell,
            type: "tulou"
          },
          {
            x: config.pondCenter.x,
            z: config.pondCenter.z,
            r: config.pondRadius + WORLD.cell,
            type: "pond"
          },
          {
            x: config.tulouX,
            z: config.tulouZ - config.radius - 9,
            r: 8 + config.radius * 0.15,
            type: "fengshui-forest"
          },
          {
            x: config.tulouX,
            z: config.tulouZ - config.radius * 0.45,
            r: config.radius * 0.78,
            type: "huatai"
          }
        ];

        const terrain = createTerrainMesh(materials, heightAt);
        worldRoot.add(terrain);
        worldRoot.add(createRiver(plan, materials, heightAt, waterY));
        worldRoot.add(createRoads(plan, materials, heightAt, waterY));
        worldRoot.add(createBridge(plan, materials, heightAt, waterY));
        await yieldToBrowser();

        const tulouArea = createTulouArea(config, materials, rng, heightAt);
        worldRoot.add(tulouArea.group);
        worldRoot.add(tulouArea.pond.group);
        await yieldToBrowser();

        const pagoda = createPagodaZone(
          plan,
          config,
          materials,
          rng,
          heightAt,
          reservedZones
        );

        const houses = placeHouses(
          config,
          plan,
          materials,
          rng,
          heightAt,
          reservedZones
        );
        await yieldToBrowser();

        const farms = placeFarms(
          config,
          plan,
          houses,
          materials,
          rng,
          heightAt,
          reservedZones
        );
        await yieldToBrowser();

        const paifangs = placePaifangs(
          plan,
          config,
          materials,
          rng,
          heightAt
        );

        const vegetation = createVegetation(
          config,
          plan,
          materials,
          rng,
          heightAt,
          reservedZones,
          tulouArea
        );
        await yieldToBrowser();

        const data = {
          seed: state.seed,
          config,
          plan,
          terrainSystem,
          tulouArea,
          pagoda,
          houses,
          farms,
          paifangs,
          vegetation,
          materials,
          reservedZones
        };
        data.validation = validateMap(data);

        state.mapData = data;
        if (state.cameraMode === "overview") {
          const center = new THREE.Vector3(config.tulouX, 0, config.tulouZ);
          const overviewDistance = config.radius * 6.2;
          controls.target.copy(center).add(new THREE.Vector3(4, 0, 0));
          camera.position.copy(controls.target).add(
            new THREE.Vector3(
              overviewDistance * 0.72,
              overviewDistance * 1.08,
              overviewDistance * 0.78
            )
          );
        } else {
          const cameraAngle = rng() * Math.PI * 2;
          const cameraRadius = randRange(rng, 130, 162);
          camera.position.set(
            Math.cos(cameraAngle) * cameraRadius,
            randRange(rng, 82, 108),
            Math.sin(cameraAngle) * cameraRadius
          );
          controls.target.set(randRange(rng, -9, 5), 0, randRange(rng, -4, 5));
        }
        controls.enabled = true;
        controls.update();

        updateStats(data);
        updateChecks(data.validation);

        updateModelUi();
        if (state.models.size === 0) {
          ui.protocolNote.textContent = location.protocol === "file:"
            ? "file:// 模式无法读取 GLB，当前为纯代码预览模式，加载本地 GLB 可获极致画质"
            : "当前为纯代码预览模式，加载本地 GLB 可获极致画质";
        } else {
          ui.protocolNote.textContent = location.protocol === "file:"
            ? "部分浏览器在 file:// 下无法读取 GLB，程序化模型仍可完整运行"
            : `已从本地服务器读取 ${state.models.size} 个 GLB，并自动将模型朝向接入道路体系`;
        }

        renderer.shadowMap.needsUpdate = true;
      } catch (error) {
        console.error(error);
        ui.protocolNote.textContent = `生成失败：${error.message}`;
        ui.ruleSummary.textContent = "规则校验失败";
      } finally {
        ui.loading.classList.add("hidden");
        ui.generate.disabled = false;
        state.isGenerating = false;
      }
    }

    // =========================================================
    // 05 渲染循环与后处理模块
    // =========================================================

    function tweenCamera(position, target, duration = 860) {
      state.cameraTween = {
        fromPosition: camera.position.clone(),
        toPosition: position.clone(),
        fromTarget: controls.target.clone(),
        toTarget: target.clone(),
        startedAt: performance.now(),
        duration
      };
      controls.enabled = false;
    }

    function updateCameraTween(now) {
      if (!state.cameraTween) {
        return;
      }
      const tween = state.cameraTween;
      const rawT = clamp((now - tween.startedAt) / tween.duration, 0, 1);
      const eased = 1 - Math.pow(1 - rawT, 3);
      camera.position.lerpVectors(tween.fromPosition, tween.toPosition, eased);
      controls.target.lerpVectors(tween.fromTarget, tween.toTarget, eased);
      if (rawT >= 1) {
        state.cameraTween = null;
        controls.enabled = true;
      }
    }

    function updateKeyboardPan(delta) {
      if (state.keys.size === 0 || state.cameraTween) {
        return;
      }
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) {
        forward.set(0, 0, -1);
      }
      forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      const move = new THREE.Vector3();

      if (state.keys.has("KeyW") || state.keys.has("ArrowUp")) {
        move.add(forward);
      }
      if (state.keys.has("KeyS") || state.keys.has("ArrowDown")) {
        move.sub(forward);
      }
      if (state.keys.has("KeyA") || state.keys.has("ArrowLeft")) {
        move.sub(right);
      }
      if (state.keys.has("KeyD") || state.keys.has("ArrowRight")) {
        move.add(right);
      }
      if (move.lengthSq() === 0) {
        return;
      }

      move.normalize();
      const speed = delta * controls.getDistance() * 0.34;
      camera.position.addScaledVector(move, speed);
      controls.target.addScaledVector(move, speed);
    }

    function setViewMode(mode) {
      state.cameraMode = mode;
      const isOverview = mode === "overview";
      controls.enableRotate = !isOverview;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.minPolarAngle = isOverview ? Math.PI * 0.08 : Math.PI * 0.12;
      controls.maxPolarAngle = isOverview ? Math.PI * 0.48 : Math.PI * 0.475;

      ui.viewOrbit.classList.toggle("active", !isOverview);
      ui.viewOverview.classList.toggle("active", isOverview);
      ui.viewOrbit.setAttribute("aria-pressed", String(!isOverview));
      ui.viewOverview.setAttribute("aria-pressed", String(isOverview));

      const center = state.mapData?.tulouArea
        ? new THREE.Vector3(state.mapData.config.tulouX, 0, state.mapData.config.tulouZ)
        : new THREE.Vector3(-8, 0, -2);
      const target = isOverview
        ? center.clone().add(new THREE.Vector3(4, 0, 0))
        : new THREE.Vector3(-8, 0, -1);
      const distance = state.mapData?.config.radius
        ? state.mapData.config.radius * 6.2
        : 118;
      const position = isOverview
        ? target.clone().add(new THREE.Vector3(distance * 0.72, distance * 1.08, distance * 0.78))
        : target.clone().add(new THREE.Vector3(distance * 0.9, distance * 0.74, distance * 0.92));
      tweenCamera(position, target);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      if (composer) {
        composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        composer.setSize(window.innerWidth, window.innerHeight);
      }
    }

    function animate(now) {
      const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
      state.lastFrame = now;
      state.waterTextures.forEach((texture, index) => {
        texture.offset.x -= delta * (0.018 + index * 0.0008);
        texture.offset.y += delta * 0.0025;
      });
      state.waterMaterials.forEach((material) => {
        if (material.userData.shader) {
          material.userData.shader.uniforms.uWaveTime.value += delta;
        }
      });
      updateCameraTween(now);
      updateKeyboardPan(delta);
      controls.update();
      if (composer) {
        composer.render(delta);
      } else {
        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);
    }

    // =========================================================
    // 06 UI 控制模块：生成、视角、GLB 状态、键盘移动
    // =========================================================

    window.addEventListener("resize", onResize);
    ui.generate.addEventListener("click", () => {
      scheduleConstruction(() => generateMap(), 0);
    });
    ui.viewOrbit.addEventListener("click", () => setViewMode("orbit"));
    ui.viewOverview.addEventListener("click", () => setViewMode("overview"));
    ui.useGLB.addEventListener("change", () => {
      updateModelUi();
      if (state.mapData) {
        scheduleConstruction(() => generateMap(), 0);
      }
    });

    window.addEventListener("keydown", (event) => {
      const target = event.target;
      const isEditing = target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target instanceof HTMLSelectElement;
      if (isEditing) {
        return;
      }
      if ([
        "KeyW",
        "KeyA",
        "KeyS",
        "KeyD",
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"
      ].includes(event.code)) {
        event.preventDefault();
        state.keys.add(event.code);
      }
    });

    window.addEventListener("keyup", (event) => {
      state.keys.delete(event.code);
    });

    window.addEventListener("blur", () => {
      state.keys.clear();
    });

    createSky();
    onResize();
    requestAnimationFrame(animate);

    updateModelUi();
    // 首屏先跑程序化地图，保证即使 CDN、GLB 或后处理失败也能立即看到结果。
    scheduleConstruction(() => generateMap(), 50);
    scheduleConstruction(() => initializePostProcessing(), 1400);

    if (ui.useGLB.checked) {
      setTimeout(() => {
        loadExternalModels()
          .then((models) => {
            updateModelUi();
            if (models.size > 0 && ui.useGLB.checked) {
              scheduleConstruction(() => generateMap(), 0);
            }
          })
          .catch((error) => {
            console.warn("外部模型探测失败，继续使用程序化模型。", error);
            state.modelsLoaded = true;
            state.loadingModels = false;
            updateModelUi();
          });
      }, 1200);
    }
  </script>
</body>
</html>
